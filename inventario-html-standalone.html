            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                const result = await api('login', {
  username,
  password
});

onLogin(result.user);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'login', username, password })
                    });
                    const result = await response.json();
                    if (result.success) {
                        onLogin(result.user);
                    } else {
                        setError(result.error || 'Errore di login');

                } finally {

        function ModeScanner({ user }) {
            const [scanInput, setScanInput] = useState('');
            const [giacenza, setGiacenza] = useState([]);
            const [storico, setStorico] = useState([]);
            const [currentItem, setCurrentItem] = useState(null);
            const [message, setMessage] = useState({ type: '', text: '' });
            const inputRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) {
                    inputRef.current.focus();
                }
            }, []);

            const handleScan = (e) => {
                if (e.key === 'Enter' && scanInput.trim()) {
                    const scanned = scanInput.trim().toUpperCase();
                    
                    // CONTROLLO 1: Verifica se già inventariato
                    const alreadyScanned = storico.find(item => 
                        String(item.Seriale_Riscontrato).toUpperCase() === scanned
                    );

                    if (alreadyScanned) {
                        setMessage({ 
                            type: 'warning', 
                            text: '⚠️ SERIALE GIÀ REGISTRATO IN PRECEDENZA' 
                        });
                        playBeep('error');
                        setScanInput('');
                        setTimeout(() => setMessage({ type: '', text: '' }), 3000);
                        return;
                    }

                    // CONTROLLO 2: Cerca nella giacenza
                    const found = giacenza.find(item => 
                        String(item.RISCONTROSERIALEF).toUpperCase() === scanned &&
                        !item.inventariato
                    );

                    if (found) {
                        const match = String(found.RISCONTROSERIALEF).toUpperCase() === scanned;
                        
                        setCurrentItem(found);
                        setMessage({ 
                            type: match ? 'success' : 'error', 
                            text: match ? '✅ MATCH OK - SERIALE CONFERMATO!' : '❌ SERIALE NON CORRISPONDENTE' 
                        });

                        // Salva nello storico
                        const newStorico = {
                            ID: Date.now().toString(),
                            Timestamp: new Date(),
                            Operatore: user.nome,
                            PoNr: found.PoNr,
                            Cdc: found.Cdc,
                            CodSap: found.CodSap,
                            Descrizione: found.Descrizione,
                            'SerS/No': found['SerS/No'],
                            RISCONTROSERIALEF: found.RISCONTROSERIALEF,
                            Stato: found.Stato,
                            Ubicazioni: found.Ubicazioni,
                            'Qtà': found['Qtà'],
                            Seriale_Riscontrato: scanned,
                            Match: match ? 'OK' : 'KO'
                        };

                        setStorico([newStorico, ...storico]);

                        // Marca come inventariato
                        setGiacenza(giacenza.map(item => 
                            item.RISCONTROSERIALEF === found.RISCONTROSERIALEF 
                                ? {...item, inventariato: true} 
                                : item
                        ));

                        playBeep(match ? 'success' : 'error');
                    } else {
                        setMessage({ type: 'error', text: '❌ SERIALE NON TROVATO IN GIACENZA' });
                        playBeep('error');
                    }

                    setScanInput('');
                    setTimeout(() => setMessage({ type: '', text: '' }), 3000);
                }
            };

            const playBeep = (type) => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = type === 'success' ? 800 : 400;
                oscillator.type = 'square';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Modalità Scanner</h2>

                    <div className="bg-white rounded-lg shadow p-6">
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                            <Icons.Camera /> Scansiona Seriale
                        </label>
                        <input
                            ref={inputRef}
                            type="text"
                            value={scanInput}
                            onChange={(e) => setScanInput(e.target.value)}
                            onKeyPress={handleScan}
                            className="w-full px-4 py-3 text-2xl border-2 border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            placeholder="Premi trigger scanner..."
                            autoFocus
                        />
                        <p className="text-sm text-gray-500 mt-2">
                            Premi il trigger dello scanner Zebra. Demo: prova INWIT252994454I76603
                        </p>
                    </div>

                    {message.text && (
                        <div className={`p-4 rounded-lg text-white text-xl font-bold text-center ${
                            message.type === 'success' ? 'bg-green-500' : 
                            message.type === 'warning' ? 'bg-yellow-500' : 'bg-red-500'
                        }`}>
                            {message.text}
                        </div>
                    )}

                    {currentItem && (
                        <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold mb-4">Dettagli Item</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <InfoRow label="Po Nr" value={currentItem.PoNr} />
                                <InfoRow label="CDC" value={currentItem.Cdc} />
                                <InfoRow label="Cod. SAP" value={currentItem.CodSap} />
                                <InfoRow label="Stato" value={currentItem.Stato} />
                                <InfoRow label="Descrizione" value={currentItem.Descrizione} className="col-span-2" />
                                <InfoRow label="Ubicazione" value={currentItem.Ubicazioni} />
                                <InfoRow label="Qtà" value={currentItem['Qtà']} />
                                <InfoRow label="Serializzato" value={currentItem['SerS/No']} />
                                <InfoRow label="Seriale Atteso" value={currentItem.RISCONTROSERIALEF} className="col-span-2" />
                            </div>
                        </div>
                    )}

                    {/* Contatori */}
                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
                            <p className="text-sm text-blue-700 font-medium">Totale Giacenza</p>

                        <div className="bg-green-50 border border-green-200 rounded-lg p-4 text-center">

                                {giacenza.filter(i => !i.inventariato).length}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function ModeLista({ user }) {
            const [giacenza] = useState([]);
            const [selected, setSelected] = useState({});

            const handleSelectAll = () => {
                const newSelected = {};
                giacenza.forEach((item, idx) => {
                    newSelected[idx] = true;
                });
                setSelected(newSelected);
            };

            const handleSave = () => {
                const count = Object.values(selected).filter(Boolean).length;
                alert(`${count} articoli salvati!`);
                setSelected({});
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Modalità Lista</h2>

                    <div className="flex gap-4">
                        <button
                            onClick={handleSelectAll}
                            className="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600"
                        >
                            Seleziona Tutti
                        </button>
                        <button
                            onClick={handleSave}
                            disabled={Object.values(selected).filter(Boolean).length === 0}
                            className="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 disabled:opacity-50"
                        >
                            Salva ({Object.values(selected).filter(Boolean).length})
                        </button>
                    </div>

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-3 py-2 text-left">
                                            <input type="checkbox" onChange={(e) => {
                                                if (e.target.checked) handleSelectAll();
                                                else setSelected({});
                                            }} />
                                        </th>
                                        <th className="px-3 py-2 text-left font-semibold">Po Nr</th>
                                        <th className="px-3 py-2 text-left font-semibold">CDC</th>
                                        <th className="px-3 py-2 text-left font-semibold">Cod. SAP</th>
                                        <th className="px-3 py-2 text-left font-semibold">Descrizione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ser. S/N</th>
                                        <th className="px-3 py-2 text-left font-semibold">Stato</th>
                                        <th className="px-3 py-2 text-left font-semibold">Qtà</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ubicazione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale Atteso</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {giacenza.map((item, idx) => (
                                        <tr key={idx} className="border-t hover:bg-gray-50">
                                            <td className="px-3 py-2">
                                                <input
                                                    type="checkbox"
                                                    checked={selected[idx] || false}
                                                    onChange={(e) => setSelected({...selected, [idx]: e.target.checked})}
                                                />
                                            </td>
                                            <td className="px-3 py-2 font-medium">{item.PoNr}</td>
                                            <td className="px-3 py-2">{item.Cdc}</td>
                                            <td className="px-3 py-2 font-medium">{item.CodSap}</td>
                                            <td className="px-3 py-2">{item.Descrizione}</td>
                                            <td className="px-3 py-2 text-center">
                                                {item['SerS/No'] === 'Sì' ? '✅' : '❌'}
                                            </td>
                                            <td className="px-3 py-2">
                                                <span className={`px-2 py-1 rounded text-xs font-medium ${
                                                    item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
                                                }`}>
                                                    {item.Stato}
                                                </span>
                                            </td>
                                            <td className="px-3 py-2 text-center">{item['Qtà']}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.Ubicazioni}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.RISCONTROSERIALEF}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <p className="text-gray-600">
                        Totale articoli: {giacenza.length}
                    </p>
                </div>
            );
        }

        function Storico({ user }) {
            const [storico] = useState([]);
            const [filters, setFilters] = useState({});
            const [filteredData, setFilteredData] = useState([]);

            const applyFilters = () => {
                let filtered = [...storico];

                if (filters.operatore) {
                    filtered = filtered.filter(item =>
                        item.Operatore.toLowerCase().includes(filters.operatore.toLowerCase())
                    );
                }

                if (filters.ubicazione) {
                    filtered = filtered.filter(item =>
                        item.Ubicazioni.toUpperCase().includes(filters.ubicazione.toUpperCase())
                    );
                }

                if (filters.cdc) {
                    filtered = filtered.filter(item =>
                        item.Cdc.toUpperCase().includes(filters.cdc.toUpperCase())
                    );
                }

                if (filters.match) {
                    filtered = filtered.filter(item => item.Match === filters.match);
                }

                setFilteredData(filtered);
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Storico Inventario</h2>

                    {/* Filtri */}
                    <div className="bg-white rounded-lg shadow p-6">
                        <h3 className="font-semibold mb-4">Filtri</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <input
                                type="text"
                                placeholder="Operatore"
                                value={filters.operatore || ''}
                                onChange={(e) => setFilters({...filters, operatore: e.target.value})}
                                className="px-4 py-2 border rounded-lg"
                            />
                            <input
                                type="text"
                                placeholder="Ubicazione"
                                value={filters.ubicazione || ''}
                                onChange={(e) => setFilters({...filters, ubicazione: e.target.value})}
                                className="px-4 py-2 border rounded-lg"
                            />
                            <input
                                type="text"
                                placeholder="CDC"
                                value={filters.cdc || ''}
                                onChange={(e) => setFilters({...filters, cdc: e.target.value})}
                                className="px-4 py-2 border rounded-lg"
                            />
                            <select
                                value={filters.match || ''}
                                onChange={(e) => setFilters({...filters, match: e.target.value})}
                                className="px-4 py-2 border rounded-lg"
                            >
                                <option value="">Tutti i match</option>
                                <option value="OK">Solo OK</option>
                                <option value="KO">Solo KO</option>
                            </select>
                        </div>
                        <div className="mt-4">
                            <button
                                onClick={applyFilters}
                                className="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600"
                            >
                                Applica Filtri
                            </button>
                        </div>
                    </div>

                    {/* Tabella Storico */}
                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-3 py-2 text-left font-semibold">Data/Ora</th>
                                        <th className="px-3 py-2 text-left font-semibold">Operatore</th>
                                        <th className="px-3 py-2 text-left font-semibold">Po Nr</th>
                                        <th className="px-3 py-2 text-left font-semibold">CDC</th>
                                        <th className="px-3 py-2 text-left font-semibold">Cod. SAP</th>
                                        <th className="px-3 py-2 text-left font-semibold">Descrizione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ser. S/N</th>
                                        <th className="px-3 py-2 text-left font-semibold">Stato</th>
                                        <th className="px-3 py-2 text-left font-semibold">Qtà</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ubicazione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale Atteso</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale Riscontrato</th>
                                        <th className="px-3 py-2 text-left font-semibold">Match</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.map((item, idx) => (
                                        <tr key={idx} className="border-t hover:bg-gray-50">
                                            <td className="px-3 py-2 whitespace-nowrap">
                                                {new Date(item.Timestamp).toLocaleString('it-IT', {
                                                    day: '2-digit',
                                                    month: '2-digit',
                                                    year: 'numeric',
                                                    hour: '2-digit',
                                                    minute: '2-digit'
                                                })}
                                            </td>
                                            <td className="px-3 py-2 font-medium">{item.Operatore}</td>
                                            <td className="px-3 py-2">{item.PoNr}</td>
                                            <td className="px-3 py-2">{item.Cdc}</td>
                                            <td className="px-3 py-2 font-medium">{item.CodSap}</td>
                                            <td className="px-3 py-2">{item.Descrizione}</td>
                                            <td className="px-3 py-2 text-center">
                                                {item['SerS/No'] === 'Sì' ? '✅' : '❌'}
                                            </td>
                                            <td className="px-3 py-2">
                                                <span className={`px-2 py-1 rounded text-xs font-medium ${
                                                    item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
                                                }`}>
                                                    {item.Stato}
                                                </span>
                                            </td>
                                            <td className="px-3 py-2 text-center">{item['Qtà']}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.Ubicazioni}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.RISCONTROSERIALEF}</td>
                                            <td className="px-3 py-2 font-mono text-xs font-bold">{item.Seriale_Riscontrato}</td>
                                            <td className="px-3 py-2">
                                                {item.Match === 'OK' ? (
                                                    <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-medium">
                                                        <Icons.CheckCircle />
                                                        OK
                                                    </span>
                                                ) : (
                                                    <span className="inline-flex items-center gap-1 px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-medium">
                                                        <Icons.XCircle />
                                                        KO
                                                    </span>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="flex justify-between items-center">
                        <p className="text-gray-600">
                            Visualizzati: <strong>{filteredData.length}</strong> di <strong>{storico.length}</strong> riscontri
                        </p>
                        <div className="flex gap-4">
                            <div className="text-sm">
                                <span className="text-green-600 font-bold">
                                    {filteredData.filter(i => i.Match === 'OK').length} OK
                                </span>
                                {' / '}
                                <span className="text-red-600 font-bold">
                                    {filteredData.filter(i => i.Match === 'KO').length} KO
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
