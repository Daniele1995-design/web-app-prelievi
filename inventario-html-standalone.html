<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario ATS</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
   
    <style>
        @page {
            size: 100mm 100mm;
            margin: 0;
        }
        .print-only {
            display: none;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // CONFIGURAZIONE
        // ============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbypiaZ1faHma7yjnvaoweiV5pjkBbxr_3pZf0kXceomBtTHryxUnl6nhKPVWC_Cilc6/exec';
        const DEMO_MODE = false;

        async function api(action, payload = {}) {
            const res = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({ action, ...payload })
            });

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            }

            const data = await res.json();
            if (!data.success) {
                throw new Error(data.error || 'Errore API');
            }
            return data;
        }

        // ============================================
        // ICONE SVG
        // ============================================
        const Icons = {
            Camera: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            ),
            Package: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
            ),
            List: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
            ),
            BarChart: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="12" y1="20" x2="12" y2="10"/>
                    <line x1="18" y1="20" x2="18" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="16"/>
                </svg>
            ),
            Printer: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="6 9 6 2 18 2 18 9"/>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                </svg>
            ),
            LogOut: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            ),
            CheckCircle: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            ),
            XCircle: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            )
        };

        // ============================================
        // APP PRINCIPALE
        // ============================================
        function App() {
            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('login');

            const handleLogout = () => {
                setUser(null);
                setCurrentView('login');
                sessionStorage.clear();
            };

            if (!user || currentView === 'login') {
                return <Login onLogin={(userData) => {
                    setUser(userData);
                    setCurrentView('dashboard');
                }} />;
            }

            return (
                <div className="min-h-screen bg-gray-100 no-print">
                    <header className="bg-blue-600 text-white p-4 shadow-lg">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold">Inventario ATS</h1>
                                <p className="text-sm opacity-90">Operatore: {user.nome}</p>
                            </div>
                            <button onClick={handleLogout} className="flex items-center gap-2 bg-red-500 px-4 py-2 rounded hover:bg-red-600">
                                <Icons.LogOut /> Esci
                            </button>
                        </div>
                    </header>

                    <nav className="bg-white shadow-md">
                        <div className="max-w-7xl mx-auto flex overflow-x-auto">
                            <NavButton icon={<Icons.BarChart />} label="Dashboard" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                            <NavButton icon={<Icons.Camera />} label="Scanner" active={currentView === 'scanner'} onClick={() => setCurrentView('scanner')} />
                            <NavButton icon={<Icons.List />} label="Lista" active={currentView === 'lista'} onClick={() => setCurrentView('lista')} />
                            <NavButton icon={<Icons.Package />} label="Storico" active={currentView === 'storico'} onClick={() => setCurrentView('storico')} />
                            <NavButton icon={<Icons.Printer />} label="Stampa" active={currentView === 'stampa'} onClick={() => setCurrentView('stampa')} />
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4">
                        {currentView === 'dashboard' && <Dashboard user={user} />}
                        {currentView === 'scanner' && <ModeScanner user={user} />}
                        {currentView === 'lista' && <ModeLista user={user} />}
                        {currentView === 'storico' && <Storico user={user} />}
                        {currentView === 'stampa' && <div className="text-center py-12 text-gray-600">Stampa - In sviluppo</div>}
                    </main>
                </div>
            );
        }

        // ============================================
        // COMPONENTI
        // ============================================
        function NavButton({ icon, label, active, onClick }) {
            return (
                <button
                    onClick={onClick}
                    className={`flex items-center gap-2 px-6 py-3 border-b-4 transition ${
                        active ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-600 hover:bg-gray-50'
                    }`}
                >
                    {icon}
                    <span className="font-medium">{label}</span>
                </button>
            );
        }

        function Login({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    const result = await api('login', { username, password });
                    onLogin(result.user);
                } catch (err) {
                    setError(err.message || 'Errore di login o connessione');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800">Inventario ATS</h1>
                            <p className="text-gray-600 mt-2">Sistema di Inventario</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Inserisci username" required />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Inserisci password" required />
                            </div>
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50">
                                {loading ? 'Accesso in corso...' : 'Accedi'}
                            </button>
                        </form>
                        <div className="mt-6 text-center text-sm text-gray-600">
                            <p>Demo: admin / admin123</p>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user }) {
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                async function load() {
                    try {
                        const res = await api('getStats');
                        setStats(res.stats);
                    } catch (err) {
                        console.error(err);
                        alert('Errore caricamento statistiche');
                    } finally {
                        setLoading(false);
                    }
                }
                load();
            }, []);

            if (loading) return <div className="text-center py-12">Caricamento statistiche...</div>;
            if (!stats) return <div className="text-center py-12 text-red-600">Impossibile caricare le statistiche</div>;

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Dashboard Inventario</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Totale Giacenza" value={stats.totaleGiacenza} icon="📦" color="bg-blue-500" />
                        <StatCard title="Inventariato" value={stats.totaleInventariato} icon="✅" color="bg-green-500" />
                        <StatCard title="Da Inventariare" value={stats.daInventariare} icon="⏳" color="bg-yellow-500" />
                        <StatCard title="Match OK" value={stats.matchOk} icon="🎯" color="bg-purple-500" />
                    </div>
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-2">
                            <span className="font-medium text-gray-700">Completamento Inventario</span>
                            <span className="text-2xl font-bold text-blue-600">{stats.percentualeCompletamento}%</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-4">
                            <div className="bg-blue-600 h-4 rounded-full transition-all" style={{ width: `${stats.percentualeCompletamento}%` }} />
                        </div>
                    </div>
                    <div className="bg-white rounded-lg shadow p-6">
                        <h3 className="text-lg font-semibold mb-4">Qualità Riscontri</h3>
                        <div className="flex gap-4">
                            <div className="flex-1 bg-green-50 border border-green-200 rounded-lg p-4">
                                <div className="flex items-center gap-2 text-green-700 mb-2">
                                    <Icons.CheckCircle /><span className="font-medium">Match OK</span>
                                </div>
                                <p className="text-3xl font-bold text-green-600">{stats.matchOk}</p>
                            </div>
                            <div className="flex-1 bg-red-50 border border-red-200 rounded-lg p-4">
                                <div className="flex items-center gap-2 text-red-700 mb-2">
                                    <Icons.XCircle /><span className="font-medium">Match KO</span>
                                </div>
                                <p className="text-3xl font-bold text-red-600">{stats.matchKo}</p>
                            </div>
                        </div>
                        <div className="mt-4 text-center">
                            <span className="text-gray-600">Accuratezza: </span>
                            <span className="text-xl font-bold text-blue-600">{stats.percentualeMatch}%</span>
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, color }) {
            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-gray-600 text-sm font-medium">{title}</span>
                        <span className="text-2xl">{icon}</span>
                    </div>
                    <p className={`text-3xl font-bold ${color.replace('bg-', 'text-')}`}>{value.toLocaleString()}</p>
                </div>
            );
        }

        function ModeScanner({ user }) {
            const [scanInput, setScanInput] = useState('');
            const [giacenza, setGiacenza] = useState([]);
            const [storico, setStorico] = useState([]);
            const [currentItem, setCurrentItem] = useState(null);
            const [message, setMessage] = useState({ type: '', text: '' });
            const [loading, setLoading] = useState(true);
            const inputRef = useRef(null);

            useEffect(() => {
                async function loadData() {
                    try {
                        const [resGiac, resStor] = await Promise.all([
                            api('getGiacenza', { filters: {} }),
                            api('getStorico', { filters: {} })
                        ]);
                        setGiacenza(resGiac.data.map(item => ({ ...item, inventariato: false })));
                        setStorico(resStor.data);
                    } catch (err) {
                        alert('Errore caricamento dati scanner');
                    } finally {
                        setLoading(false);
                    }
                }
                loadData();
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const playBeep = (type) => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = type === 'success' ? 800 : 400;
                oscillator.type = 'square';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            };

            const handleScan = async (e) => {
                if (e.key === 'Enter' && scanInput.trim()) {
                    const scanned = scanInput.trim().toUpperCase();

                    const alreadyScanned = storico.find(item => String(item.Seriale_Riscontrato || '').toUpperCase() === scanned);
                    if (alreadyScanned) {
                        setMessage({ type: 'warning', text: '⚠️ SERIALE GIÀ REGISTRATO' });
                        playBeep('error');
                        setScanInput('');
                        setTimeout(() => setMessage({ type: '', text: '' }), 3000);
                        return;
                    }

                    const found = giacenza.find(item => String(item.RISCONTROSERIALEF || '').toUpperCase() === scanned && !item.inventariato);
                    if (found) {
                        const match = String(found.RISCONTROSERIALEF).toUpperCase() === scanned;
                        setCurrentItem(found);
                        setMessage({ type: match ? 'success' : 'error', text: match ? '✅ MATCH OK!' : '❌ MISMATCH' });
                        playBeep(match ? 'success' : 'error');

                        // Salva sul server
                        try {
                            await api('saveRiscontro', {
                                data: {
                                    operatore: user.nome,
                                    codSap: found.CodSap,
                                    descrizione: found.Descrizione,
                                    ubicazione: found.Ubicazioni,
                                    serialeAtteso: found.RISCONTROSERIALEF,
                                    serialeRiscontrato: scanned,
                                    match: match,
                                    qta: found['Qtà'] || 1,
                                    wmsCode: found.WMSCode || '',
                                    cdc: found.Cdc || '',
                                    poNr: found.PoNr || ''
                                }
                            });

                            // Aggiorna locale
                            setGiacenza(prev => prev.map(item =>
                                item.RISCONTROSERIALEF === found.RISCONTROSERIALEF ? { ...item, inventariato: true } : item
                            ));
                            const newEntry = {
                                Timestamp: new Date(),
                                Operatore: user.nome,
                                Seriale_Riscontrato: scanned,
                                Match: match ? 'OK' : 'KO',
                                ...found
                            };
                            setStorico(prev => [newEntry, ...prev]);
                        } catch (err) {
                            setMessage({ type: 'error', text: 'Salvato in locale (errore server)' });
                        }
                    } else {
                        setMessage({ type: 'error', text: '❌ SERIALE NON TROVATO' });
                        playBeep('error');
                    }

                    setScanInput('');
                    setTimeout(() => setMessage({ type: '', text: '' }), 3000);
                }
            };

            if (loading) return <div className="text-center py-12">Caricamento dati scanner...</div>;

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Modalità Scanner</h2>
                    <div className="bg-white rounded-lg shadow p-6">
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                            <Icons.Camera /> Scansiona Seriale
                        </label>
                        <input
                            ref={inputRef}
                            type="text"
                            value={scanInput}
                            onChange={(e) => setScanInput(e.target.value)}
                            onKeyDown={handleScan}
                            className="w-full px-4 py-3 text-2xl border-2 border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            placeholder="Premi trigger scanner..."
                            autoFocus
                        />
                    </div>

                    {message.text && (
                        <div className={`p-4 rounded-lg text-white text-xl font-bold text-center ${
                            message.type === 'success' ? 'bg-green-500' : message.type === 'warning' ? 'bg-yellow-500' : 'bg-red-500'
                        }`}>
                            {message.text}
                        </div>
                    )}

                    {currentItem && (
                        <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold mb-4">Dettagli Item</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <InfoRow label="Po Nr" value={currentItem.PoNr} />
                                <InfoRow label="CDC" value={currentItem.Cdc} />
                                <InfoRow label="Cod. SAP" value={currentItem.CodSap} />
                                <InfoRow label="Stato" value={currentItem.Stato} />
                                <InfoRow label="Descrizione" value={currentItem.Descrizione} className="col-span-2" />
                                <InfoRow label="Ubicazione" value={currentItem.Ubicazioni} />
                                <InfoRow label="Qtà" value={currentItem['Qtà']} />
                                <InfoRow label="Serializzato" value={currentItem['SerS/No']} />
                                <InfoRow label="Seriale Atteso" value={currentItem.RISCONTROSERIALEF} className="col-span-2" />
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
                            <p className="text-sm text-blue-700 font-medium">Totale Giacenza</p>
                            <p className="text-2xl font-bold text-blue-600">{giacenza.length}</p>
                        </div>
                        <div className="bg-green-50 border border-green-200 rounded-lg p-4 text-center">
                            <p className="text-sm text-green-700 font-medium">Inventariati</p>
                            <p className="text-2xl font-bold text-green-600">{giacenza.filter(i => i.inventariato).length}</p>
                        </div>
                        <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-center">
                            <p className="text-sm text-yellow-700 font-medium">Rimanenti</p>
                            <p className="text-2xl font-bold text-yellow-600">{giacenza.filter(i => !i.inventariato).length}</p>
                        </div>
                    </div>
                </div>
            );
        }

        function InfoRow({ label, value, className = '' }) {
            return (
                <div className={className}>
                    <p className="text-sm text-gray-600 font-medium">{label}</p>
                    <p className="text-lg font-semibold text-gray-800">{value || '-'}</p>
                </div>
            );
        }

        function ModeLista({ user }) {
            const [giacenza, setGiacenza] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                async function load() {
                    try {
                        const res = await api('getGiacenza', { filters: {} });
                        setGiacenza(res.data);
                    } catch (err) {
                        alert('Errore caricamento lista');
                    } finally {
                        setLoading(false);
                    }
                }
                load();
            }, []);

            if (loading) return <div className="text-center py-12">Caricamento lista...</div>;

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Modalità Lista</h2>
                    <p className="text-gray-600">Totale articoli: {giacenza.length}</p>
                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-3 py-2 text-left font-semibold">Po Nr</th>
                                        <th className="px-3 py-2 text-left font-semibold">CDC</th>
                                        <th className="px-3 py-2 text-left font-semibold">Cod. SAP</th>
                                        <th className="px-3 py-2 text-left font-semibold">Descrizione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ser. S/N</th>
                                        <th className="px-3 py-2 text-left font-semibold">Stato</th>
                                        <th className="px-3 py-2 text-left font-semibold">Qtà</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ubicazione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale Atteso</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {giacenza.map((item, idx) => (
                                        <tr key={idx} className="border-t hover:bg-gray-50">
                                            <td className="px-3 py-2 font-medium">{item.PoNr}</td>
                                            <td className="px-3 py-2">{item.Cdc}</td>
                                            <td className="px-3 py-2 font-medium">{item.CodSap}</td>
                                            <td className="px-3 py-2">{item.Descrizione}</td>
                                            <td className="px-3 py-2 text-center">{item['SerS/No'] === 'Sì' ? '✅' : '❌'}</td>
                                            <td className="px-3 py-2">
                                                <span className={`px-2 py-1 rounded text-xs font-medium ${item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                    {item.Stato}
                                                </span>
                                            </td>
                                            <td className="px-3 py-2 text-center">{item['Qtà']}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.Ubicazioni}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.RISCONTROSERIALEF}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function Storico({ user }) {
            const [storico, setStorico] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [filters, setFilters] = useState({});
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                async function load() {
                    try {
                        const res = await api('getStorico', { filters: {} });
                        const data = res.data || [];
                        setStorico(data);
                        setFilteredData(data);
                    } catch (err) {
                        alert('Errore caricamento storico');
                    } finally {
                        setLoading(false);
                    }
                }
                load();
            }, []);

            const applyFilters = () => {
                let filtered = [...storico];

                if (filters.operatore) {
                    filtered = filtered.filter(item => (item.Operatore || '').toLowerCase().includes(filters.operatore.toLowerCase()));
                }
                if (filters.ubicazione) {
                    filtered = filtered.filter(item => (item.Ubicazioni || '').toUpperCase().includes(filters.ubicazione.toUpperCase()));
                }
                if (filters.cdc) {
                    filtered = filtered.filter(item => (item.Cdc || '').toUpperCase().includes(filters.cdc.toUpperCase()));
                }
                if (filters.match) {
                    filtered = filtered.filter(item => item.Match === filters.match);
                }

                setFilteredData(filtered);
            };

            if (loading) return <div className="text-center py-12">Caricamento storico...</div>;

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Storico Inventario</h2>
                    <div className="bg-white rounded-lg shadow p-6">
                        <h3 className="font-semibold mb-4">Filtri</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <input type="text" placeholder="Operatore" value={filters.operatore || ''} onChange={(e) => setFilters({ ...filters, operatore: e.target.value })} className="px-4 py-2 border rounded-lg" />
                            <input type="text" placeholder="Ubicazione" value={filters.ubicazione || ''} onChange={(e) => setFilters({ ...filters, ubicazione: e.target.value })} className="px-4 py-2 border rounded-lg" />
                            <input type="text" placeholder="CDC" value={filters.cdc || ''} onChange={(e) => setFilters({ ...filters, cdc: e.target.value })} className="px-4 py-2 border rounded-lg" />
                            <select value={filters.match || ''} onChange={(e) => setFilters({ ...filters, match: e.target.value })} className="px-4 py-2 border rounded-lg">
                                <option value="">Tutti i match</option>
                                <option value="OK">Solo OK</option>
                                <option value="KO">Solo KO</option>
                            </select>
                        </div>
                        <div className="mt-4">
                            <button onClick={applyFilters} className="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">Applica Filtri</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-3 py-2 text-left font-semibold">Data/Ora</th>
                                        <th className="px-3 py-2 text-left font-semibold">Operatore</th>
                                        <th className="px-3 py-2 text-left font-semibold">Cod. SAP</th>
                                        <th className="px-3 py-2 text-left font-semibold">Descrizione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ubicazione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale Atteso</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale Riscontrato</th>
                                        <th className="px-3 py-2 text-left font-semibold">Match</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.map((item, idx) => (
                                        <tr key={idx} className="border-t hover:bg-gray-50">
                                            <td className="px-3 py-2 whitespace-nowrap">
                                                {new Date(item.Timestamp).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                            </td>
                                            <td className="px-3 py-2">{item.Operatore}</td>
                                            <td className="px-3 py-2 font-medium">{item.CodSap}</td>
                                            <td className="px-3 py-2">{item.Descrizione}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.Ubicazioni}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.RISCONTROSERIALEF}</td>
                                            <td className="px-3 py-2 font-mono text-xs font-bold">{item.Seriale_Riscontrato}</td>
                                            <td className="px-3 py-2">
                                                {item.Match === 'OK' ? (
                                                    <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-medium">
                                                        <Icons.CheckCircle /> OK
                                                    </span>
                                                ) : (
                                                    <span className="inline-flex items-center gap-1 px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-medium">
                                                        <Icons.XCircle /> KO
                                                    </span>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <p className="text-gray-600">Visualizzati: <strong>{filteredData.length}</strong> di <strong>{storico.length}</strong> riscontri</p>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
