<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Inventario Scanner</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-top: 0;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #eee;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .warning {
      color: orange;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

    const API_URL = "INCOLLA_QUI_LA_TUA_WEBAPP_APPS_SCRIPT_URL";

    function App() {
      const [user, setUser] = React.useState(null);
      const [username, setUsername] = React.useState("");

      const [giacenza, setGiacenza] = React.useState([]);
      const [loading, setLoading] = React.useState(false);

      const [scanInput, setScanInput] = React.useState("");
      const [scannedSet, setScannedSet] = React.useState(new Set());
      const [scannedItems, setScannedItems] = React.useState([]);

      const [message, setMessage] = React.useState(null);

      /* LOGIN SEMPLICE */
      const handleLogin = () => {
        if (!username.trim()) return;
        setUser({ username });
        loadGiacenza();
      };

      /* CARICAMENTO GIACENZA REALE */
      const loadGiacenza = () => {
        setLoading(true);
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getGiacenza" })
        })
          .then(r => r.json())
          .then(res => {
            if (res.success) {
              setGiacenza(res.data);
            }
          })
          .finally(() => setLoading(false));
      };

      /* SCANNER */
      const handleScan = (e) => {
        if (e.key !== "Enter") return;

        const seriale = scanInput.trim();
        setScanInput("");

        if (!seriale) return;

        if (scannedSet.has(seriale)) {
          setMessage({ type: "warning", text: "⚠️ Seriale già scannerizzato" });
          return;
        }

        const found = giacenza.find(r =>
          String(r["SerS/No"]).trim() === seriale
        );

        if (!found) {
          setMessage({ type: "error", text: "❌ Seriale NON trovato" });
          return;
        }

        setScannedSet(prev => new Set(prev).add(seriale));
        setScannedItems(prev => [...prev, {
          ...found,
          SERIALE_RISCONTRATO: seriale,
          UTENTE: user.username,
          DATA: new Date().toLocaleString()
        }]);

        setMessage({ type: "success", text: "✅ Match OK" });

        /* salva storico backend */
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveScan",
            seriale,
            utente: user.username
          })
        });
      };

      /* UI LOGIN */
      if (!user) {
        return (
          <div>
            <h2>Login Operatore</h2>
            <input
              placeholder="Nome operatore"
              value={username}
              onChange={e => setUsername(e.target.value)}
            />
            <button onClick={handleLogin}>Entra</button>
          </div>
        );
      }

      /* UI PRINCIPALE */
      return (
        <div>
          <h2>Scanner Inventario</h2>
          <p>Operatore: <b>{user.username}</b></p>

          {loading && <p>Caricamento giacenza...</p>}

          <input
            autoFocus
            placeholder="Scansiona seriale"
            value={scanInput}
            onChange={e => setScanInput(e.target.value)}
            onKeyDown={handleScan}
          />

          {message && (
            <p className={message.type}>{message.text}</p>
          )}

          <h3>Storico sessione</h3>

          <table>
            <thead>
              <tr>
                <th>PoNr</th>
                <th>CDC</th>
                <th>Articolo</th>
                <th>Seriale</th>
                <th>Utente</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody>
              {scannedItems.map((r, i) => (
                <tr key={i}>
                  <td>{r.PoNr}</td>
                  <td>{r.Cdc}</td>
                  <td>{r.Articolo}</td>
                  <td>{r.SERIALE_RISCONTRATO}</td>
                  <td>{r.UTENTE}</td>
                  <td>{r.DATA}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
