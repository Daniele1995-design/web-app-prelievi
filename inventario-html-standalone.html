<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario ATS</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
   
<style>
    @page {
        size: 100mm auto;
        margin: 0;
    }
    .print-only { display: none; }
    @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { margin: 0; padding: 0; background: white; }
        html, body { width: 100mm; }
        #print-area { width: 100mm; margin: 0 auto; }
        .etichetta-10x10, .etichetta-10x5 {
            page-break-after: always;
        }
    }
   
    /* ========== ETICHETTA 10x10 ========== */
    .etichetta-10x10 {
        width: 100mm;
        height: 100mm;
        border: none;                   /* rimosso il bordo */
        background: white;
        padding: 4mm 5mm 4mm 5mm;       /* padding uniforme, più spazio interno */
        box-sizing: border-box;
        page-break-after: always;
        position: relative;
        margin: 0;
        font-family: Arial, sans-serif;
    }
   
    .logo-container {
        height: 10mm;
        margin-bottom: 2mm;
        position: relative;
    }
   
    .logo-img {
        height: 9mm;
        width: auto;
    }
   
    .label-cod-bp {
        position: absolute;
        right: 0mm;                     /* attaccato al bordo destro */
        top: 5mm;
        font-size: 6.5pt;
        font-weight: bold;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        letter-spacing: 0.5px;
    }
   
    .bp-section {
        margin-bottom: 2mm;
        position: relative;
        padding-right: 8mm;             /* QR BP più a sinistra */
    }
   
    .bp-label {
        font-size: 9pt;
        font-weight: bold;
    }
   
    .bp-value {
        font-size: 24pt;                /* ingrandito ulteriormente */
        font-weight: bold;
        line-height: 1;
    }
   
    .qr-bp {
        position: absolute;
        top: 5mm;
        right: 7mm;                     /* allineato a sinistra della scritta verticale */
        width: 9mm;
        height: 9mm;
    }
   
    .etichetta-10x10 hr {
        border: none;
        border-top: 2px solid black;
        margin: 2mm 0;
    }
   
    .etichetta-10x10 hr.thin {
        border-top: 1.5px solid black;
        margin: 1.5mm 0;
    }
   
    .art-label {
        font-size: 9pt;
        font-weight: bold;
        margin: 0 0 1.5mm;
    }
   
    .barcode-svg {
        width: 82mm;
        height: 26px;
        margin: 0 auto 1.5mm;
        display: block;
    }
   
    .wms {
        text-align: center;
        font-size: 12pt;
        font-weight: bold;
        margin: 0 0 2mm;
    }
   
    .po-row {
        margin: 2mm 0;
        display: flex;
        justify-content: space-between;
    }
   
    .po-label {
        font-size: 9pt;
        font-weight: bold;
    }
   
    .po-value {
        font-size: 18pt;
        font-weight: bold;
    }
   
    .label-tpn {
        position: absolute;
        right: 3mm;
        top: 55mm;
        font-size: 6.5pt;
        font-weight: bold;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
    }
   
    /* Parte bassa spostata più giù */
    .part-section {
        margin-top: 8mm;                /* spostato più in basso */
        margin-bottom: 2mm;
        position: relative;
        padding-right: 8mm;
    }
   
    .part-label {
        font-size: 9pt;
        font-weight: bold;
    }
   
    .part-value {
        font-size: 15pt;
        font-weight: bold;
    }
   
    .qr-part {
        position: absolute;
        top: 0;
        right: 7mm;                     /* allineato a sinistra della scritta */
        width: 9mm;
        height: 9mm;
    }
   
    .sn-section {
        position: relative;
        margin: 2mm 0;
        padding-right: 8mm;
    }
   
    .sn-label {
        font-size: 9pt;
        font-weight: bold;
    }
   
    .sn-value {
        font-size: 15pt;
        font-weight: bold;
    }
   
    .qr-sn {
        position: absolute;
        top: 0;
        right: 7mm;
        width: 9mm;
        height: 9mm;
    }
   
    .label-sn {
        position: absolute;
        right: 0mm;                     /* attaccato al bordo destro */
        bottom: 8mm;
        font-size: 6.5pt;
        font-weight: bold;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
    }
   
    .ubicazione-under-sn {
        margin-top: 2mm;
    }
   
    .ubicazione-under-sn .pos-label {
        font-size: 9pt;
        font-weight: bold;
    }
   
    .ubicazione-under-sn .pos-value {
        font-size: 13pt;
        font-weight: bold;
        line-height: 1.2;
        word-break: break-all;
    }

    /* ========== ETICHETTA 10x5 ========== */
    .etichetta-10x5 {
        width: 100mm;
        height: 50mm;
        border: none;                   /* rimosso bordo se vuoi, altrimenti rimetti 1px */
        background: white;
        padding: 3mm;
        box-sizing: border-box;
        page-break-after: always;
        position: relative;
        font-family: Arial, sans-serif;
    }
   
    .et5-logo {
        height: 7mm;
        width: auto;
        display: inline-block;
        vertical-align: top;
        margin-bottom: 2mm;             /* spostato più giù */
    }
   
    .et5-codbp {
        display: inline-block;
        float: right;
        text-align: right;
        font-weight: bold;
        font-size: 13pt;
        line-height: 1.2;
        margin-bottom: 2mm;
    }
   
    .et5-qr-bp {
        width: 6mm;
        height: 6mm;
        vertical-align: middle;
        margin-left: 2mm;
    }
   
    .et5-barcode {
        width: 65mm;
        height: 18px;
        display: block;
        margin: 3mm auto 2mm;           /* barcode più in basso */
    }
   
    .et5-wms {
        text-align: center;
        font-weight: bold;
        font-size: 9pt;
        margin: 0 0 3mm;                /* WMS più in basso */
    }
   
    .et5-info {
        font-size: 8pt;
        display: flex;
        justify-content: space-between;
        margin-top: 3mm;                /* info più in basso */
        align-items: flex-start;
    }
   
    .et5-info div {
        line-height: 1.4;
        flex: 1;
    }
   
    .et5-qr-sn {
        width: 6mm;
        height: 6mm;
        margin-left: 3mm;
        flex-shrink: 0;
    }
   
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
</style>
</head>
<body>
    <div id="root"></div>
    <div id="print-area" style="display:none;"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'https://script.google.com/macros/s/AKfycbypiaZ1faHma7yjnvaoweiV5pjkBbxr_3pZf0kXceomBtTHryxUnl6nhKPVWC_Cilc6/exec';

        const appCache = { 
    giacenza: null, 
    storico: null, 
    stats: null, 
    lastUpdate: {
        giacenza: null,
        storico: null,
        stats: null
    }
};

// Durata cache in millisecondi
const CACHE_TIME = 3 * 60 * 1000; // 3 minuti

// Controlla se cache è valida
function isCacheValid(key) {
    if (!appCache[key] || !appCache.lastUpdate[key]) return false;
    return (Date.now() - appCache.lastUpdate[key]) < CACHE_TIME;
}

        async function api(action, payload = {}) {
            const res = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, ...payload })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Errore API');
            return data;
        }

        const Icons = {
            Camera: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
            Package: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
            List: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
            BarChart: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
            Printer: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            CheckCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            XCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Filter: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
        };

        function App() {
            const [user, setUser] = useState(() => {
    const saved = sessionStorage.getItem('ats_user');
    return saved ? JSON.parse(saved) : null;
});

const [currentView, setCurrentView] = useState(() => {
    return sessionStorage.getItem('ats_view') || 'login';
});

useEffect(() => {
    if (user) {
        sessionStorage.setItem('ats_user', JSON.stringify(user));
        sessionStorage.setItem('ats_view', currentView);
    }
}, [user, currentView]);

    const handleLogout = () => {
        setUser(null);
        setCurrentView('login');
        sessionStorage.clear();
        Object.keys(appCache).forEach(k => appCache[k] = null);
    };

    if (!user || currentView === 'login') {
        return <Login onLogin={(userData) => { setUser(userData); setCurrentView('dashboard'); }} />;
    }

    return (
                <div className="min-h-screen bg-gray-100 no-print">
                    <header className="bg-blue-600 text-white p-4 shadow-lg">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div><h1 className="text-2xl font-bold">Inventario ATS</h1><p className="text-sm opacity-90">Operatore: {user.nome}</p></div>
                            <button onClick={handleLogout} className="flex items-center gap-2 bg-red-500 px-4 py-2 rounded hover:bg-red-600"><Icons.LogOut /> Esci</button>
                        </div>
                    </header>
                    <nav className="bg-white shadow-md">
                        <div className="max-w-7xl mx-auto flex overflow-x-auto">
                            <NavButton icon={<Icons.BarChart />} label="Dashboard" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                            <NavButton icon={<Icons.Camera />} label="Scanner" active={currentView === 'scanner'} onClick={() => setCurrentView('scanner')} />
                            <NavButton icon={<Icons.List />} label="Lista" active={currentView === 'lista'} onClick={() => setCurrentView('lista')} />
                            <NavButton icon={<Icons.Package />} label="Storico" active={currentView === 'storico'} onClick={() => setCurrentView('storico')} />
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto p-4">
                        {currentView === 'dashboard' && <Dashboard user={user} />}
                        {currentView === 'scanner' && <ModeScanner user={user} />}
                        {currentView === 'lista' && <ModeLista user={user} />}
                        {currentView === 'storico' && <Storico user={user} />}
                    </main>
                </div>
            );
        }

        function NavButton({ icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`flex items-center gap-2 px-6 py-3 border-b-4 transition ${active ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-600 hover:bg-gray-50'}`}>
                    {icon}<span className="font-medium">{label}</span>
                </button>
            );
        }

        function Login({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const result = await api('login', { username, password });
                    onLogin(result.user);
                } catch (err) {
                    setError(err.message || 'Errore di login');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800">Inventario ATS</h1>
                            <p className="text-gray-600 mt-2">Sistema di Inventario</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Username" required />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Password" required />
                            </div>
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50">{loading ? 'Accesso...' : 'Accedi'}</button>
                        </form>
                    </div>
                </div>
            );
        }

        function Dashboard({ user }) {
            const [stats, setStats] = useState(appCache.stats);
            const [loading, setLoading] = useState(!appCache.stats);

            useEffect(() => {
                async function load() {
                    try {
                        const res = await api('getStats');
                        setStats(res.stats);
                        appCache.stats = res.stats;
                        appCache.lastUpdate = Date.now();
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                }
                
                if (!appCache.stats || (appCache.lastUpdate && Date.now() - appCache.lastUpdate > 60000)) load();
                const interval = setInterval(() => { if (Date.now() - appCache.lastUpdate > 60000) load(); }, 60000);
                return () => clearInterval(interval);
            }, []);

            if (loading) return <div className="text-center py-12">Caricamento...</div>;
            if (!stats) return <div className="text-center py-12 text-red-600">Errore</div>;

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Dashboard Inventario</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Totale Giacenza" value={stats.totaleGiacenza} icon="📦" color="bg-blue-500" />
                        <StatCard title="Inventariato" value={stats.totaleInventariato} icon="✅" color="bg-green-500" />
                        <StatCard title="Da Inventariare" value={stats.daInventariare} icon="⏳" color="bg-yellow-500" />
                        <StatCard title="Match OK" value={stats.matchOk} icon="🎯" color="bg-purple-500" />
                    </div>
                    <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex justify-between items-center mb-2">
                            <span className="font-medium text-gray-700">Completamento</span>
                            <span className="text-2xl font-bold text-blue-600">{stats.percentualeCompletamento}%</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-4">
                            <div className="bg-blue-600 h-4 rounded-full transition-all" style={{ width: `${stats.percentualeCompletamento}%` }} />
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, color }) {
            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-gray-600 text-sm font-medium">{title}</span>
                        <span className="text-2xl">{icon}</span>
                    </div>
                    <p className={`text-3xl font-bold ${color.replace('bg-', 'text-')}`}>{value.toLocaleString()}</p>
                </div>
            );
        }

        function ModeScanner({ user }) {
            const [scanInput, setScanInput] = useState('');
            const [giacenza, setGiacenza] = useState(appCache.giacenza || []);
            const [storico, setStorico] = useState(appCache.storico || []);
            const [currentItem, setCurrentItem] = useState(null);
            const [message, setMessage] = useState({ type: '', text: '' });
            const [loading, setLoading] = useState(!appCache.giacenza);
            const [editingUbicazione, setEditingUbicazione] = useState(false);
            const [newUbicazione, setNewUbicazione] = useState('');
            const [formatoStampa, setFormatoStampa] = useState('10x10');
            const inputRef = useRef(null);

            useEffect(() => {
                async function loadData() {
                    if (appCache.giacenza && appCache.storico) {
                        setGiacenza(appCache.giacenza);
                        setStorico(appCache.storico);
                        setLoading(false);
                        return;
                    }
                    
                    try {
                        const [resGiac, resStor] = await Promise.all([
                            api('getGiacenza', { filters: {} }),
                            api('getStorico', { filters: {} })
                        ]);
                        const giacenzaData = resGiac.data.map(item => ({ ...item, inventariato: false }));
                        setGiacenza(giacenzaData);
                        setStorico(resStor.data);
                        appCache.giacenza = giacenzaData;
                        appCache.storico = resStor.data;
                    } catch (err) {
                        alert('Errore caricamento');
                    } finally {
                        setLoading(false);
                    }
                }
                loadData();
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const playBeep = (type) => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = type === 'success' ? 800 : 400;
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            };

            const handleScan = async (e) => {
                if (e.key === 'Enter' && scanInput.trim()) {
                    const scanned = scanInput.trim().toUpperCase();

                    const alreadyScanned = storico.find(item => String(item.Seriale_Riscontrato || '').toUpperCase() === scanned);
                    if (alreadyScanned) {
                        setMessage({ type: 'warning', text: '⚠️ GIÀ REGISTRATO' });
                        playBeep('error');
                        setScanInput('');
                        setTimeout(() => setMessage({ type: '', text: '' }), 3000);
                        return;
                    }

                    const found = giacenza.find(item => String(item.RISCONTROSERIALEF || '').toUpperCase() === scanned && !item.inventariato);
                    if (found) {
                        const match = String(found.RISCONTROSERIALEF).toUpperCase() === scanned;
                        setCurrentItem(found);
                        setNewUbicazione(found.Ubicazioni || '');
                        setMessage({ type: match ? 'success' : 'error', text: match ? '✅ MATCH OK!' : '❌ MISMATCH' });
                        playBeep(match ? 'success' : 'error');

                        try {
                            await api('saveRiscontro', {
                                data: {
                                    operatore: user.nome,
                                    codSap: found.CodSap,
                                    descrizione: found.Descrizione,
                                    ubicazione: found.Ubicazioni,
                                    serialeAtteso: found.RISCONTROSERIALEF,
                                    serialeRiscontrato: scanned,
                                    match: match,
                                    qta: found['Qtà'] || 1,
                                    wmsCode: found.WMSCode || '',
                                    cdc: found.Cdc || '',
                                    poNr: found.PoNr || '',
                                    idRigaGiacenza: found.ID_Riga || ''  // NUOVO!
                                }
                            });
// INVALIDA CACHE

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-3 py-2"><input type="checkbox" onChange={(e) => setSelected(e.target.checked ? filteredData : [])} checked={selected.length === filteredData.length && filteredData.length > 0} /></th>
                                        <th className="px-3 py-2 text-left font-semibold">Po Nr</th>
                                        <th className="px-3 py-2 text-left font-semibold">CDC</th>
                                        <th className="px-3 py-2 text-left font-semibold">Cod. SAP</th>
                                        <th className="px-3 py-2 text-left font-semibold">Descrizione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ser. S/N</th>
                                        <th className="px-3 py-2 text-left font-semibold">Stato</th>
                                        <th className="px-3 py-2 text-left font-semibold">Ubicazione</th>
                                        <th className="px-3 py-2 text-left font-semibold">Seriale</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.map((item, idx) => (
                                        <tr key={idx} className="border-t hover:bg-gray-50">
                                            <td className="px-3 py-2"><input type="checkbox" checked={selected.find(i => i.RISCONTROSERIALEF === item.RISCONTROSERIALEF) !== undefined} onChange={() => toggleSelect(item)} /></td>
                                            <td className="px-3 py-2 font-medium">{item.PoNr}</td>
                                            <td className="px-3 py-2">{item.Cdc}</td>
                                            <td className="px-3 py-2 font-medium">{item.CodSap}</td>
                                            <td className="px-3 py-2">{item.Descrizione}</td>
                                            <td className="px-3 py-2 text-center">{item['SerS/No'] === 'Sì' ? '✅' : '❌'}</td>
                                            <td className="px-3 py-2"><span className={`px-2 py-1 rounded text-xs font-medium ${item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{item.Stato}</span></td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.Ubicazioni}</td>
                                            <td className="px-3 py-2 font-mono text-xs">{item.RISCONTROSERIALEF}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function Storico({ user }) {
            const [storico, setStorico] = useState(appCache.storico || []);
            const [filteredData, setFilteredData] = useState([]);
            const [filters, setFilters] = useState({});
            const [loading, setLoading] = useState(!appCache.storico);
            const [showFilters, setShowFilters] = useState(false);
            const [editingItems, setEditingItems] = useState({});
            const [selected, setSelected] = useState([]);
            const [bulkUbicazione, setBulkUbicazione] = useState('');
            const [formatoStampa, setFormatoStampa] = useState('10x10');

            useEffect(() => {
                async function load() {
                    if (appCache.storico) {
                        setStorico(appCache.storico);
                        setFilteredData(appCache.storico);
                        setLoading(false);
                        return;
                    }
                    try {
                        const res = await api('getStorico', { filters: {} });
                        const data = res.data || [];
                        setStorico(data);
                        setFilteredData(data);
                        appCache.storico = data;
                    } catch (err) {
                        alert('Errore caricamento');
                    } finally {
                        setLoading(false);
                    }
                }
                load();
            }, []);

            const applyFilters = () => {
                let filtered = [...storico];
                if (filters.operatore) filtered = filtered.filter(i => (i.Operatore || '').toLowerCase().includes(filters.operatore.toLowerCase()));
                if (filters.ubicazione) filtered = filtered.filter(i => (i.Ubicazioni || '').toUpperCase().includes(filters.ubicazione.toUpperCase()));
                if (filters.cdc) filtered = filtered.filter(i => (i.Cdc || '').toUpperCase().includes(filters.cdc.toUpperCase()));
                if (filters.match) filtered = filtered.filter(i => i.Match === filters.match);
                setFilteredData(filtered);
                setShowFilters(false);
            };

            const updateUbicazione = async (item, newUbic) => {
                try {
                    await api('updateUbicazione', { seriale: item.Seriale_Riscontrato, ubicazione: newUbic });
                    const updated = storico.map(i => i.Seriale_Riscontrato === item.Seriale_Riscontrato ? { ...i, Ubicazioni: newUbic } : i);
                    setStorico(updated);
                    appCache.storico = updated;
                    setFilteredData(updated);
                    setEditingItems(prev => { const n = {...prev}; delete n[item.Seriale_Riscontrato]; return n; });
                    alert('Ubicazione aggiornata');
                } catch (err) {
                    alert('Errore aggiornamento');
                }
            };

            const updateBulkUbicazione = async () => {
                if (selected.length === 0 || !bulkUbicazione.trim()) return;
                if (!window.confirm(`Aggiornare ubicazione per ${selected.length} articoli?`)) return;
                
                try {
                    for (const item of selected) {
                        await api('updateUbicazione', { seriale: item.Seriale_Riscontrato, ubicazione: bulkUbicazione });
                    }
                    const updated = storico.map(i => selected.find(s => s.Seriale_Riscontrato === i.Seriale_Riscontrato) ? { ...i, Ubicazioni: bulkUbicazione } : i);
                    setStorico(updated);
                    appCache.storico = updated;
                    setFilteredData(updated);
                    setSelected([]);
                    setBulkUbicazione('');
                    alert('Ubicazioni aggiornate');
                } catch (err) {
                    alert('Errore aggiornamento');
                }
            };

            const stampaSelezionati = () => {
    if (selected.length === 0) return alert('Seleziona almeno un articolo');

    const printArea = document.getElementById('print-area');
    const timestamp = Date.now(); // ← generato una sola volta

    let html = '';
    selected.forEach((item, idx) => {
        const bcId = `bc-multi-${idx}-${timestamp}`; // ← ID unico e coerente

        if (formatoStampa === '10x10') {
            html += `
                <div class="etichetta-10x10">
                    <div class="logo-container">
                        <img class="logo-img" src="https://raw.githubusercontent.com/Daniele1995-design/WebAppSap/refs/heads/main/logo%20ats.jpg" crossorigin="anonymous">
                        <div class="label-cod-bp">COD BP</div>
                    </div>
                    <div class="bp-section">
                        <div class="bp-label">Codice BP</div>
                        <div class="bp-value">${item.CodSap || ''}</div>
                        <img class="qr-bp" src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(item.CodSap || '')}" crossorigin="anonymous">
                    </div>
                    <hr>
                    <div class="art-label">Articolo</div>
                    <svg class="barcode-svg" id="${bcId}"></svg>
                    <div class="wms">${item.WMSCode || ''}</div>
                    <hr>
                    <div class="po-row">
                        <div class="po-col"><span class="po-label">Po Nr°</span><span class="po-value">${item.PoNr || ''}</span></div>
                        <div class="po-col" style="text-align:right;"><span class="po-label">Posizione</span><span class="po-value">${item.Stato || ''}</span></div>
                    </div>
                    <div class="label-tpn">TPN</div>
                    <hr class="thin">
                    <div class="part-section">
                        <span class="part-label">Part Number</span>
                        <span class="part-value">${item.CodSap || ''}</span>
                        <img class="qr-part" src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(item.CodSap || '')}" crossorigin="anonymous">
                    </div>
                    <hr class="thin">
                    <div class="sn-section">
                        <span class="sn-label">SerialNumber/Lotto</span>
                        <span class="sn-value">${item.RISCONTROSERIALEF || item.Seriale_Riscontrato || ''}</span>
                        <img class="qr-sn" src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(item.RISCONTROSERIALEF || item.Seriale_Riscontrato || '')}" crossorigin="anonymous">
                        <div class="label-sn">SN</div>
                    </div>
                    <div class="ubicazione-under-sn">
                        <span class="pos-label">Ubicazione</span>
                        <div class="pos-value">${item.Ubicazioni || ''}</div>
                    </div>
                </div>`;
        } else {
            html += `
                <div class="etichetta-10x5">
                    <img class="et5-logo" src="https://raw.githubusercontent.com/Daniele1995-design/WebAppSap/refs/heads/main/logo%20ats.jpg" crossorigin="anonymous">
                    <div class="et5-codbp">Codice BP<br>${item.CodSap || ''}<img class="et5-qr-bp" src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(item.CodSap || '')}" crossorigin="anonymous"></div>
                    <svg class="et5-barcode" id="${bcId}"></svg>
                    <div class="et5-wms">${item.WMSCode || ''}</div>
                    <div class="et5-info">
                        <div>PO Nr°: ${item.PoNr || ''} / Pos: ${item.Stato || ''}<br>Part Number: ${item.CodSap || ''}<br>Seriale: ${item.RISCONTROSERIALEF || item.Seriale_Riscontrato || ''}</div>
                        <img class="et5-qr-sn" src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(item.RISCONTROSERIALEF || item.Seriale_Riscontrato || '')}" crossorigin="anonymous">
                    </div>
                </div>`;
        }
    });

    printArea.innerHTML = html;
    printArea.style.display = 'block';

    const images = Array.from(printArea.querySelectorAll('img'));
    const imagePromises = images.map(img => {
        return new Promise(resolve => {
            if (img.complete && img.naturalHeight !== 0) resolve();
            else {
                img.onload = resolve;
                img.onerror = resolve;
                setTimeout(resolve, 3000);
            }
        });
    });

    Promise.all(imagePromises).then(() => {
        selected.forEach((item, idx) => {
            const bcId = `bc-multi-${idx}-${timestamp}`; // ← stesso ID di prima
            const element = document.getElementById(bcId);
            if (item.WMSCode && element) {
                JsBarcode(element, item.WMSCode, {
                    format: "CODE128",
                    height: formatoStampa === '10x10' ? 20 : 18,
                    width: 1.5,
                    displayValue: false,
                    margin: 0
                });
            }
        });

        setTimeout(() => {
            window.print();
            printArea.style.display = 'none';
            printArea.innerHTML = '';
        }, 500);
    });
};
            if (loading) return <div className="text-center py-12">Caricamento...</div>;

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Storico Inventario</h2>
                        <button onClick={() => setShowFilters(!showFilters)} className="flex items-center gap-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                            <Icons.Filter /> Filtri
                        </button>
                    </div>

                    {showFilters && (
                        <div className="modal-overlay" onClick={() => setShowFilters(false)}>
                            <div className="bg-white rounded-lg shadow-2xl p-6 max-w-2xl w-full" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-lg font-bold mb-4">Filtri Avanzati</h3>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <input type="text" placeholder="Operatore" value={filters.operatore || ''} onChange={(e) => setFilters({ ...filters, operatore: e.target.value })} className="px-3 py-2 border rounded" />
                                    <input type="text" placeholder="Ubicazione" value={filters.ubicazione || ''} onChange={(e) => setFilters({ ...filters, ubicazione: e.target.value })} className="px-3 py-2 border rounded" />
                                    <input type="text" placeholder="CDC" value={filters.cdc || ''} onChange={(e) => setFilters({ ...filters, cdc: e.target.value })} className="px-3 py-2 border rounded" />
                                    <select value={filters.match || ''} onChange={(e) => setFilters({ ...filters, match: e.target.value })} className="px-3 py-2 border rounded">
                                        <option value="">Tutti i match</option>
                                        <option value="OK">Solo OK</option>
                                        <option value="KO">Solo KO</option>
                                    </select>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={applyFilters} className="flex-1 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Applica</button>
                                    <button onClick={() => { setFilters({}); setFilteredData(storico); setShowFilters(false); }} className="flex-1 bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Reset</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {selected.length > 0 && (
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                            <p className="font-medium mb-2">{selected.length} articoli selezionati</p>
                            <div className="flex gap-2 items-center flex-wrap">
                                <input type="text" placeholder="Nuova ubicazione" value={bulkUbicazione} onChange={(e) => setBulkUbicazione(e.target.value)} className="px-3 py-2 border rounded" />
                                <button onClick={updateBulkUbicazione} className="flex items-center gap-1 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                                    <Icons.Edit /> Aggiorna Ubicazione
                                </button>
                                <select value={formatoStampa} onChange={(e) => setFormatoStampa(e.target.value)} className="px-3 py-2 border rounded">
                                    <option value="10x10">10×10</option>
                                    <option value="10x5">10×5</option>
                                </select>
                                <button onClick={stampaSelezionati} className="flex items-center gap-1 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                                    <Icons.Printer /> Stampa
                                </button>
                                <button onClick={() => setSelected([])} className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Deseleziona</button>
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
    <thead className="bg-gray-50">
        <tr>
            <th className="px-3 py-2">
                <input 
                    type="checkbox" 
                    onChange={(e) => setSelected(e.target.checked ? filteredData : [])} 
                    checked={selected.length === filteredData.length && filteredData.length > 0} 
                />
            </th>
            <th className="px-3 py-2 text-left font-semibold">Data/Ora</th>
            <th className="px-3 py-2 text-left font-semibold">Operatore</th>
            <th className="px-3 py-2 text-left font-semibold">Cod. SAP</th>
            <th className="px-3 py-2 text-left font-semibold">Descrizione</th>
            <th className="px-3 py-2 text-left font-semibold">CDC</th>
            <th className="px-3 py-2 text-left font-semibold">Stato</th>
            <th className="px-3 py-2 text-left font-semibold">Ubicazione</th>
            <th className="px-3 py-2 text-left font-semibold">Seriale Atteso</th>
            <th className="px-3 py-2 text-left font-semibold">Seriale Riscontrato</th>
            <th className="px-3 py-2 text-left font-semibold">Match</th>
        </tr>
    </thead>
    <tbody>
        {filteredData.map((item, idx) => (
            <tr key={idx} className="border-t hover:bg-gray-50">
                <td className="px-3 py-2">
                    <input 
                        type="checkbox" 
                        checked={selected.find(i => i.Seriale_Riscontrato === item.Seriale_Riscontrato) !== undefined} 
                        onChange={() => {
                            setSelected(prev => 
                                prev.find(i => i.Seriale_Riscontrato === item.Seriale_Riscontro) 
                                    ? prev.filter(i => i.Seriale_Riscontrato !== item.Seriale_Riscontrato) 
                                    : [...prev, item]
                            );
                        }} 
                    />
                </td>
                <td className="px-3 py-2 whitespace-nowrap">
                    {new Date(item.Timestamp).toLocaleString('it-IT', { 
                        day: '2-digit', month: '2-digit', year: 'numeric', 
                        hour: '2-digit', minute: '2-digit' 
                    })}
                </td>
                <td className="px-3 py-2">{item.Operatore}</td>
                <td className="px-3 py-2 font-medium">{item.CodSap}</td>
                <td className="px-3 py-2">{item.Descrizione}</td>
                <td className="px-3 py-2">{item.Cdc || '-'}</td>
                <td className="px-3 py-2">
                    <span className={`px-2 py-1 rounded text-xs font-medium ${item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                        {item.Stato || '-'}
                    </span>
                </td>
                <td className="px-3 py-2">
                    {editingItems[item.Seriale_Riscontrato] ? (
                        <div className="flex gap-1">
                            <input 
                                type="text" 
                                defaultValue={item.Ubicazioni} 
                                onBlur={(e) => updateUbicazione(item, e.target.value)} 
                                className="px-2 py-1 border rounded text-xs w-32" 
                                autoFocus 
                            />
                        </div>
                    ) : (
                        <div className="flex gap-1 items-center">
                            <span className="font-mono text-xs">{item.Ubicazioni}</span>
                            <button 
                                onClick={() => setEditingItems(prev => ({ ...prev, [item.Seriale_Riscontrato]: true }))} 
                                className="text-blue-500 hover:text-blue-700"
                            >
                                <Icons.Edit />
                            </button>
                        </div>
                    )}
                </td>
                <td className="px-3 py-2 font-mono text-xs">{item.RISCONTROSERIALEF || '-'}</td>
                <td className="px-3 py-2 font-mono text-xs font-bold">{item.Seriale_Riscontrato}</td>
                <td className="px-3 py-2">
                    {item.Match === 'OK' ? (
                        <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-medium">
                            <Icons.CheckCircle /> OK
                        </span>
                    ) : (
                        <span className="inline-flex items-center gap-1 px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-medium">
                            <Icons.XCircle /> KO
                        </span>
                    )}
                </td>
            </tr>
        ))}
    </tbody>
                            </table>
                        </div>
                    </div>
                    <p className="text-gray-600">Visualizzati: <strong>{filteredData.length}</strong> di <strong>{storico.length}</strong> riscontri</p>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
