<style>
/* ======================================================
   STILI ORIGINALI (COPIATI DAL TUO FILE)
====================================================== */
body { margin: 0px; background: #f0f0f0; font-family: Arial, sans-serif; }

  .no-print { display: none; }
  @page { size: 100mm 100mm; margin: 0; }
  html, body { width: 100mm; height: 100mm; margin: 0; padding: 0; }

/* ETICHETTA 10x10 */
.etichetta-10x10 { width: 100mm; height: 100mm; border: 0.5px solid #000; background: white; padding: 2mm 3.5mm; box-sizing: border-box; page-break-after: always; position: relative; }
.logo-container { height: 10mm; margin-bottom: 0.5mm; position: relative; }
.logo-img { height: 9mm; }
.label-cod-bp { position: absolute; right: 0; top: 12mm; font-size: 7pt; font-weight: bold; writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.3px; }
.bp-section { margin-bottom: 1mm; }
.bp-label { font-size: 9pt; font-weight: bold; margin-bottom: 0.2mm; }
.bp-value { font-size: 18pt; font-weight: bold; line-height: 1; }
.qr-bp { position: absolute; top: 11mm; right: 13mm; width: 10mm; height: 10mm; }

.po-row { margin-top: 0.1mm; margin-bottom: 0.5mm; display: flex; justify-content: space-between; }
.po-label { font-size: 9pt; font-weight: bold; }
.po-value { font-size: 13pt; font-weight: bold; line-height: 1; display: block; }
.label-tpn { position: absolute; right: 3mm; top: 61mm; font-size: 7pt; font-weight: bold; writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.3px; }
.part-section { margin: 0.1mm 0 1mm; position: relative; }
.part-label { font-size: 9pt; font-weight: bold; }
.part-value { font-size: 13pt; font-weight: bold; line-height: 1; display: block; }
.qr-part { position: absolute; top: 0; right: 3.5mm; width: 10mm; height: 10mm; }
.sn-section { position: relative; margin: 0.5mm 0 0.5mm; }
.sn-label { font-size: 9pt; font-weight: bold; }
.sn-value { font-size: 15pt; font-weight: bold; line-height: 1.2; display: block; }
.qr-sn { position: absolute; top: 7mm; right: 3.5mm; width: 10mm; height: 10mm; }

/* ETICHETTA 10x5 */
.etichetta-10x5 { width: 100mm; height: 50mm; border: 0.5px solid #000; background: white; padding: 2mm 3mm; box-sizing: border-box; page-break-after: always; position: relative; font-size: 8pt; }

.etichetta-10x10g .bp-label { font-size: 9pt; font-weight: bold; margin-bottom: 0.2mm; }

.etichetta-10x10g hr { border: none; border-top: 0.1px solid black; margin: 0.5mm 0; }
.etichetta-10x10g hr.thin { border-top: 0.5px solid black; margin: 1mm 0; }

.etichetta-10x10g .po-label { font-size: 9pt; font-weight: bold; }
.etichetta-10x10g .po-value { font-size: 13pt; font-weight: bold; line-height: 1; display: block; }
.etichetta-10x10g .label-tpn { position: absolute; right: 3mm; top: 61mm; font-size: 7pt; font-weight: bold; writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.3px; }

<body>
    <div id="root"></div>
    <div id="print-area" style="display:none;"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Configurazione
        const SUPABASE_URL = 'https://gggkjzbggdaujoyxmvxa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnZ2tqemJnZ2RhdWpveXhtdnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwMjY3NjcsImV4cCI6MjA4MzYwMjc2N30.8Qikb54_UnZdVj71mISuoZytByI2sosk57noLebU76A';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Database locale (IndexedDB)
        const dbCache = {
            db: null,
            async init() {
                return new Promise((resolve) => {
                    const req = indexedDB.open('ATS_DB_V2', 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        db.createObjectStore('giacenza', { keyPath: 'ID_Riga' });
                        db.createObjectStore('storico', { keyPath: 'id', autoIncrement: true });
                    };
                    req.onsuccess = () => { this.db = req.result; resolve(); };
                });
            },
            async set(store, data) {
                const tx = this.db.transaction(store, 'readwrite');
                const s = tx.objectStore(store);
                s.clear();
                data.forEach(d => s.add(d));
            },
            async getAll(store) {
                return new Promise(res => {
                    const tx = this.db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).getAll();
                    req.onsuccess = () => res(req.result);
                });
            }
        };

        // ======================================================
        // DATA ADAPTER (TRADUTTORE)
        // Trasforma i dati Supabase nel formato del tuo file
        // ======================================================
        const adaptGiacenza = (dbData) => dbData.map(item => ({
            ID_Riga: item.id_riga,
            PoNr: item.po_nr || '',
            Cdc: item.cdc || '',
            CodSap: item.cod_sap || '',
            Descrizione: item.descrizione || '',
            'SerS/No': item.ser_sn || '',
            Stato: item.stato || '',
            Ubicazioni: item.ubicazioni || '',
            WMSCode: item.wms_code || '',
            RISCONTROSERIALEF: item.riscontro_seriale_f || '',
            PartNumber: item.part_number || '',
            inventariato: item.stato === 'INVENTARIATO',
            Match: item.match || ''
        }));

        const adaptStorico = (dbData) => dbData.map(item => ({
            id: item.id,
            Timestamp: item.timestamp,
            Operatore: item.operatore,
            CodSap: item.cod_sap,
            Descrizione: item.descrizione,
            Ubicazioni: item.ubicazione,
            Seriale_Riscontrato: item.seriale_riscontrato,
            RISCONTROSERIALEF: item.seriale_atteso,
            Match: item.match ? 'OK' : 'KO',
            WMSCode: item.wms_code,
            Cdc: item.cdc,
            PoNr: item.po_nr,
            PartNumber: item.part_number
        }));

        // ======================================================
        // API MANAGER (SOSTITUISCE GOOGLE APPS SCRIPT)
        // ======================================================
        async function apiCall(action, payload = {}) {
            try {
                switch (action) {
                    case 'login':
                        const { data: user, error: lErr } = await supabase
                            .from('utenti')
                            .select('*')
                            .eq('username', payload.username)
                            .eq('password', payload.password)
                            .single();
                        if (lErr || !user) throw new Error('Login fallito');
                        return { user };

                    case 'getGiacenza':
                        const { data: gData, error: gErr } = await supabase
                            .from('giacenza')
                            .select('*');
                        if (gErr) throw gErr;
                        return { data: adaptGiacenza(gData) };

                    case 'getStorico':
                        const { data: sData, error: sErr } = await supabase
                            .from('inventario')
                            .select('*')
                            .order('timestamp', { ascending: false })
                            .limit(1000);
                        if (sErr) throw sErr;
                        return { data: adaptStorico(sData) };

                    case 'registraScansione':
                        // 1. Inserimento Storico
                        const { error: insErr } = await supabase
                            .from('inventario')
                            .insert([{
                                operatore: payload.operatore,
                                cod_sap: payload.codSap,
                                descrizione: payload.descrizione,
                                ubicazione: payload.ubicazione,
                                seriale_atteso: payload.serialeAtteso,
                                seriale_riscontrato: payload.serialeRiscontrato,
                                match: payload.match === 'OK',
                                wms_code: payload.wmsCode,
                                po_nr: payload.poNr,
                                part_number: payload.partNumber,
                                id_riga_giacenza: payload.idRigaGiacenza
                            }]);
                        if (insErr) throw insErr;

                        // 2. Aggiornamento Giacenza (se Match OK)
                        if (payload.match === 'OK') {
                            await supabase
                                .from('giacenza')
                                .update({ stato: 'INVENTARIATO', match: 'OK' })
                                .eq('id_riga', payload.idRigaGiacenza);
                        }
                        return { success: true };

                    case 'updateUbicazione':
                        await supabase
                            .from('giacenza')
                            .update({ ubicazioni: payload.ubicazione })
                            .eq('riscontro_seriale_f', payload.seriale);
                        return { success: true };

                    case 'updatePartNumber':
                        await supabase
                            .from('giacenza')
                            .update({ part_number: payload.partNumber })
                            .eq('riscontro_seriale_f', payload.seriale);
                        return { success: true };

                    default: return { success: true };
                }
            } catch (err) {
                console.error("Errore API:", err);
                throw err;
            }
        }

        // ======================================================
        // QUEUE MANAGER (LA TUA LOGICA ORIGINALE)
        // ======================================================
        const operationQueue = {
            queue: [],
            processing: false,
            async add(action, payload) {
                this.queue.push({ action, payload, id: Date.now() });
                this.process();
            },
            async process() {
                if (this.processing || this.queue.length === 0) return;
                this.processing = true;
                while (this.queue.length > 0) {
                    const op = this.queue[0];
                    try {
                        await apiCall(op.action, op.payload);
                        this.queue.shift();
                    } catch (e) {
                        console.log("Riprovo tra 5 secondi...");
                        await new Promise(r => setTimeout(r, 5000));
                        break; 
                    }
                }
                this.processing = false;
            }
        };

        const ICON_SIZE = 20;
        // ============================================
        // ICONE (LE TUE ORIGINALI)
        // ============================================
        const Icons = {
            Camera: () => <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
            Package: () => <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
            List: () => <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
            BarChart: () => <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
            Printer: () => <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            LogOut: () => <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            CheckCircle: () => <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            XCircle: () => <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Search: () => <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Edit: () => <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Check: () => <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        };

        // --- LOGIN ---
        function Login({ onLogin }) {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [err, setErr] = useState('');
            const handle = async (e) => {
                e.preventDefault();
                try {
                    const res = await apiCall('login', { username: u, password: p });
                    onLogin(res.user);
                } catch { setErr('Errore login'); }
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-blue-600 p-4">
                    <form onSubmit={handle} className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <h2 className="text-2xl font-bold mb-6 text-center">ATS Inventory Accedi</h2>
                        {err && <div className="text-red-500 mb-4">{err}</div>}
                        <input className="w-full p-3 mb-4 border rounded" placeholder="Username" value={u} onChange={e=>setU(e.target.value)} />
                        <input type="password" className="w-full p-3 mb-6 border rounded" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white p-3 rounded font-bold">ACCEDI</button>
                    </form>
                </div>
            );
        }

        // --- DASHBOARD ---
        function Dashboard() {
            const [stats, setStats] = useState({totale:0, inventariato:0, mancanti:0, percentuale:0});
            useEffect(() => {
                const load = async () => {
                    const res = await apiCall('getGiacenza');
                    const inv = res.data.filter(i => i.inventariato).length;
                    setStats({
                        totale: res.data.length,
                        inventariato: inv,
                        mancanti: res.data.length - inv,
                        percentuale: res.data.length > 0 ? Math.round((inv/res.data.length)*100) : 0
                    });
                };
                load();
            }, []);
            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white p-6 rounded-xl shadow">
                        <p className="text-sm text-gray-500">TOTALE</p>
                        <p className="text-3xl font-bold">{stats.totale}</p>
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow text-green-600">
                        <p className="text-sm">INVENTARIATO</p>
                        <p className="text-3xl font-bold">{stats.inventariato}</p>
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow">
                        <p className="text-sm">PROGRESSO</p>
                        <p className="text-3xl font-bold">{stats.percentuale}%</p>
                    </div>
                </div>
            );
        }
        function ModeScanner({ user }) {
            const [scanned, setScanned] = useState('');
            const [manual, setManual] = useState('');
            const [status, setStatus] = useState({ type: 'idle', msg: 'In attesa di scansione...' });
            const [lastItem, setLastItem] = useState(null);
            
            const audioCtx = useRef(new (window.AudioContext || window.webkitAudioContext)());
            const beep = (freq, dur) => {
                const osc = audioCtx.current.createOscillator();
                const gain = audioCtx.current.createGain();
                osc.connect(gain); gain.connect(audioCtx.current.destination);
                osc.frequency.value = freq; osc.start();
                setTimeout(() => osc.stop(), dur);
            };

            const handleScan = async (val) => {
                if (!val) return;
                setStatus({ type: 'loading', msg: 'Verifica in corso...' });
                const giacenza = await dbCache.getAll('giacenza');
                const match = giacenza.find(i => i.RISCONTROSERIALEF === val);

                if (match) {
                    if (match.inventariato) {
                        beep(300, 500);
                        setStatus({ type: 'error', msg: `GIÀ INVENTARIATO: ${val}` });
                    } else {
                        beep(1000, 200);
                        operationQueue.add('registraScansione', {
                            operatore: user.nome,
                            idRigaGiacenza: match.ID_Riga,
                            serialeAtteso: val,
                            serialeRiscontrato: val,
                            match: 'OK',
                            codSap: match.CodSap,
                            descrizione: match.Descrizione,
                            ubicazione: match.Ubicazioni,
                            wmsCode: match.WMSCode,
                            poNr: match.PoNr,
                            partNumber: match.PartNumber
                        });
                        setStatus({ type: 'success', msg: `OK: ${match.Descrizione}` });
                        setLastItem(match);
                        // Aggiorna cache locale per non rifarlo
                        match.inventariato = true;
                        await dbCache.set('giacenza', giacenza);
                    }
                } else {
                    beep(200, 800);
                    setStatus({ type: 'error', msg: `NON IN ANAGRAFICA: ${val}` });
                }
                setScanned('');
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm">
                        <input 
                            autoFocus 
                            className="w-full p-4 border-2 border-blue-500 rounded-xl text-center text-2xl" 
                            placeholder="SCANSIONA SERIALE"
                            value={scanned}
                            onChange={e => {setScanned(e.target.value); if(e.target.value.length > 5) handleScan(e.target.value)}}
                        />
                        <div className={`mt-4 p-4 rounded-xl text-center font-bold ${
                            status.type === 'error' ? 'bg-red-100 text-red-700' : 
                            status.type === 'success' ? 'bg-green-100 text-green-700' : 'bg-gray-100'
                        }`}>
                            {status.msg}
                        </div>
                    </div>
                </div>
            );
        }
        function ModeLista() {
            const [data, setData] = useState([]);
            const [filter, setFilter] = useState('');
            useEffect(() => {
                dbCache.getAll('giacenza').then(setData);
            }, []);

            const filtered = data.filter(i => 
                Object.values(i).some(v => String(v).toLowerCase().includes(filter.toLowerCase()))
            );

            return (
                <div className="bg-white rounded-xl shadow overflow-hidden">
                    <div className="p-4 border-b">
                        <input className="w-full p-2 border rounded" placeholder="Filtra giacenza..." onChange={e=>setFilter(e.target.value)} />
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-gray-50 uppercase font-bold">
                                <tr><th className="p-3">CodSap</th><th className="p-3">Seriale</th><th className="p-3">Stato</th></tr>
                            </thead>
                            <tbody>
                                {filtered.slice(0, 50).map(i => (
                                    <tr key={i.ID_Riga} className="border-t">
                                        <td className="p-3">{i.CodSap}</td>
                                        <td className="p-3 font-mono">{i.RISCONTROSERIALEF}</td>
                                        <td className="p-3">{i.inventariato ? '✅' : '❌'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function Storico() {
            const [logs, setLogs] = useState([]);
            useEffect(() => {
                apiCall('getStorico').then(res => setLogs(res.data));
            }, []);
            return (
                <div className="space-y-2">
                    {logs.map(l => (
                        <div key={l.id} className="bg-white p-3 rounded shadow-sm text-xs flex justify-between">
                            <span>{l.Timestamp} - <strong>{l.Seriale_Riscontrato}</strong></span>
                            <span className={l.Match === 'OK' ? 'text-green-600' : 'text-red-600'}>{l.Match}</span>
                        </div>
                    ))}
                </div>
            );
        }

        // --- MAIN APP RENDER ---
        function Main() {
            const [view, setView] = useState('login');
            const [user, setUser] = useState(null);

            if (view === 'login') return <Login onLogin={(u) => {setUser(u); setView('dash')}} />;

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-blue-700 text-white p-4 flex justify-between">
                        <span className="font-bold">ATS INVENTORY</span>
                        <button onClick={() => setView('login')}>Esci</button>
                    </header>
                    <nav className="flex bg-white border-b">
                        <button className="flex-1 p-3" onClick={() => setView('dash')}>STATO</button>
                        <button className="flex-1 p-3" onClick={() => setView('scanner')}>SCANNER</button>
                        <button className="flex-1 p-3" onClick={() => setView('lista')}>LISTA</button>
                    </nav>
                    <div className="p-4 flex-1">
                        {view === 'dash' && <Dashboard />}
                        {view === 'scanner' && <ModeScanner user={user} />}
                        {view === 'lista' && <ModeLista />}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Main />, document.getElementById('root'));
    </script>
</body>
</html>
