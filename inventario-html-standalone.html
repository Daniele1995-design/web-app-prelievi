    const playBeep = (type) => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = type === 'success' ? 800 : 400;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    };

    const handleScan = async (e) => {
    if (e.key === 'Enter' && scanInput.trim()) {
        const scanned = scanInput.trim().toUpperCase();
        setScanInput('');
        
        try {
            // 1. Verifica se già inventariato
            const { data: existing } = await supabase
                .from('inventario')
                .select('id')
                .ilike('seriale_riscontrato', scanned)
                .single();
            
            if (existing) {
                setMessage({ type: 'warning', text: '⚠️ GIÀ REGISTRATO' });
                playBeep('error');
                return;
            }
            
            // 2. Cerca in giacenza
            const { data: found, error: searchError } = await supabase
                .from('giacenza')
                .select('*')
                .ilike('riscontro_seriale_f', scanned)
                .eq('inventariato', false)
                .single();
            
            if (searchError || !found) {
                setMessage({ type: 'error', text: '❌ NON TROVATO' });
                playBeep('error');
                return;
            }
            
            const match = found.riscontro_seriale_f.toUpperCase() === scanned;
            
            // 3. Salva in inventario
            const { error: insertError } = await supabase
                .from('inventario')
                .insert({
                    operatore: user.nome,
                    cod_sap: found.cod_sap,
                    descrizione: found.descrizione,
                    ubicazione: found.ubicazioni,
                    seriale_atteso: found.riscontro_seriale_f,
                    seriale_riscontrato: scanned,
                    match: match ? 'OK' : 'KO',
                    qta: found.qta || 1,
                    wms_code: found.wms_code,
                    cdc: found.cdc,
                    po_nr: found.po_nr,
                    part_number: found.part_number,
                    id_riga_giacenza: found.id_riga
                });
            
            if (insertError) throw insertError;
            
            // 4. Aggiorna giacenza
            const { error: updateError } = await supabase
                .from('giacenza')
                .update({
                    inventariato: true,
                    match: match ? 'OK' : 'KO',
                    timestamp: new Date().toISOString(),
                    operatore: user.nome
                })
                .eq('id_riga', found.id_riga);
            
            if (updateError) throw updateError;
            
            // 5. Aggiorna UI
            setCurrentItem(found);
            setMessage({ type: match ? 'success' : 'error', text: match ? '✅ MATCH OK!' : '❌ MISMATCH' });
            playBeep(match ? 'success' : 'error');
            
            // Ricarica giacenza
            const { data: refreshed } = await supabase
                .from('giacenza')
                .select('*')
                .eq('inventariato', false);
            setGiacenza(refreshed || []);
            
        } catch (err) {
            console.error('Errore scan:', err);
            setMessage({ type: 'error', text: '❌ ERRORE: ' + err.message });
            playBeep('error');
        }
        
        setTimeout(() => setMessage({ type: '', text: '' }), 3000);
    }
};

    if (!window.confirm(`Verificare ${selected.length} articoli?`)) return;

            </div>
            {showFilters && (
                <div className="modal-overlay" onClick={() => setShowFilters(false)}>
                    <div className="bg-white rounded-lg shadow-2xl p-6 max-w-2xl w-full" onClick={(e) => e.stopPropagation()}>
                        <h3 className="text-lg font-bold mb-4">Filtri Avanzati</h3>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <input type="text" placeholder="Operatore" value={filters.operatore || ''} onChange={(e) => setFilters({ ...filters, operatore: e.target.value })} className="px-3 py-2 border rounded" />
                            <input type="text" placeholder="Po Nr (esatto)" value={filters.poNr || ''} onChange={(e) => setFilters({ ...filters, poNr: e.target.value })} className="px-3 py-2 border rounded" />
                            <input type="text" placeholder="Ubicazione" value={filters.ubicazione || ''} onChange={(e) => setFilters({ ...filters, ubicazione: e.target.value })} className="px-3 py-2 border rounded" />
                            <input type="text" placeholder="CDC" value={filters.cdc || ''} onChange={(e) => setFilters({ ...filters, cdc: e.target.value })} className="px-3 py-2 border rounded" />
                            <input type="text" placeholder="Stato" value={filters.stato || ''} onChange={(e) => setFilters({ ...filters, stato: e.target.value })} className="px-3 py-2 border rounded" />
                            <input type="text" placeholder="Cod. SAP (esatto)" value={filters.codSap || ''} onChange={(e) => setFilters({ ...filters, codSap: e.target.value })} className="px-3 py-2 border rounded" />
                            <input type="text" placeholder="Data (gg/mm/aaaa)" value={filters.dataOra || ''} onChange={(e) => setFilters({ ...filters, dataOra: e.target.value })} className="px-3 py-2 border rounded" />
                            <select value={filters.match || ''} onChange={(e) => setFilters({ ...filters, match: e.target.value })} className="px-3 py-2 border rounded">
                                <option value="">Tutti i match</option>
                                <option value="OK">Solo OK</option>
                                <option value="KO">Solo KO</option>
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={applyFilters} className="flex-1 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Applica</button>
                            <button onClick={() => { setFilters({}); setFilteredData(storico); setShowFilters(false); }} className="flex-1 bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Reset</button>
                        </div>
                    </div>
                </div>
            )}

            {selected.length > 0 && (
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <p className="font-medium mb-2">{selected.length} articoli selezionati</p>
                    <div className="flex gap-2 items-center flex-wrap">
                        <input type="text" placeholder="Nuova ubicazione" value={bulkUbicazione} onChange={(e) => setBulkUbicazione(e.target.value)} className="px-3 py-2 border rounded" />
                        <input type="text" placeholder="Nuovo Part Number" 
       value={bulkPartNumber} 
       onChange={(e) => setBulkPartNumber(e.target.value)} 
       className="px-3 py-2 border rounded" />

                        <button onClick={updateBulkUbicazione} className="flex items-center gap-1 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                            <Icons.Edit /> Aggiorna Ubicazione
                        </button>
                        <button onClick={updateBulkPartNumber} 
        className="flex items-center gap-1 bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
    🔧 Aggiorna Part Number
</button>
                        <select value={formatoStampa} onChange={(e) => setFormatoStampa(e.target.value)} className="px-3 py-2 border rounded">
                            <option value="10x10">10×10</option>
                            <option value="10x5">10×5</option>
                            <option value="10x10g">10×10G (Generica)</option>
                        </select>
                        <button onClick={stampaSelezionati} className="flex items-center gap-1 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                            <Icons.Printer /> Stampa
                        </button>
                        <button onClick={() => setSelected([])} className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Deseleziona</button>
                    </div>
                </div>
            )}

            <div className="bg-white rounded-lg shadow overflow-hidden">
                <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead className="bg-gray-50">
                            <tr>
                                <th className="px-3 py-2">
                                    <input 
                                        type="checkbox" 
                                        onChange={(e) => setSelected(e.target.checked ? filteredData : [])} 
                                        checked={selected.length === filteredData.length && filteredData.length > 0} 
                                    />
                                </th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.dataOra ? 'col-hidden' : ''}`}>Data/Ora</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.operatore ? 'col-hidden' : ''}`}>Operatore</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.poNr ? 'col-hidden' : ''}`}>Po Nr</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.codSap ? 'col-hidden' : ''}`}>Cod. SAP</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.descrizione ? 'col-hidden' : ''}`}>Descrizione</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.cdc ? 'col-hidden' : ''}`}>CDC</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.stato ? 'col-hidden' : ''}`}>Stato</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.ubicazione ? 'col-hidden' : ''}`}>Ubicazione</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.serialeAtteso ? 'col-hidden' : ''}`}>Seriale Atteso</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.partNumber ? 'col-hidden' : ''}`}>Part Number</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.serialeRiscontrato ? 'col-hidden' : ''}`}>Seriale Riscontrato</th>
                                <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.match ? 'col-hidden' : ''}`}>Match</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filteredData.map((item, idx) => (
                                <tr key={idx} className="border-t hover:bg-gray-50">
                                    <td className="px-3 py-2">
                                        <input 
                                            type="checkbox" 
                                            checked={selected.find(i => i.Seriale_Riscontrato === item.Seriale_Riscontrato) !== undefined} 
                                            onChange={() => {
                                                setSelected(prev => 
                                                    prev.find(i => i.Seriale_Riscontrato === item.Seriale_Riscontrato) 
                                                        ? prev.filter(i => i.Seriale_Riscontrato !== item.Seriale_Riscontrato) 
                                                        : [...prev, item]
                                                );
                                            }} 
                                        />
                                    </td>
                                    <td className={`px-3 py-2 whitespace-nowrap ${!visibleColumns.dataOra ? 'col-hidden' : ''}`}>
                                        {new Date(item.Timestamp).toLocaleString('it-IT', { 
                                            day: '2-digit', month: '2-digit', year: 'numeric', 
                                            hour: '2-digit', minute: '2-digit' 
                                        })}
                                    </td>
                                    <td className={`px-3 py-2 ${!visibleColumns.operatore ? 'col-hidden' : ''}`}>{item.Operatore}</td>
                                    <td className={`px-3 py-2 ${!visibleColumns.poNr ? 'col-hidden' : ''}`}>{item.PoNr || '-'}</td>
                                    <td className={`px-3 py-2 font-medium ${!visibleColumns.codSap ? 'col-hidden' : ''}`}>{item.CodSap}</td>
                                    <td className={`px-3 py-2 ${!visibleColumns.descrizione ? 'col-hidden' : ''}`}>{item.Descrizione}</td>
                                    <td className={`px-3 py-2 ${!visibleColumns.cdc ? 'col-hidden' : ''}`}>{item.Cdc || '-'}</td>
                                    <td className={`px-3 py-2 ${!visibleColumns.stato ? 'col-hidden' : ''}`}>
                                        <span className={`px-2 py-1 rounded text-xs font-medium ${item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                            {item.Stato || '-'}
                                        </span>
                                    </td>
                                    <td className={`px-3 py-2 ${!visibleColumns.ubicazione ? 'col-hidden' : ''}`}>
                                        {editingItems[item.Seriale_Riscontrato] ? (
                                            <div className="flex gap-1">
                                                <input 
                                                    type="text" 
                                                    defaultValue={item.Ubicazioni} 
                                                    onBlur={(e) => updateUbicazione(item, e.target.value)} 
                                                    className="px-2 py-1 border rounded text-xs w-32" 
                                                    autoFocus 
                                                />
                                            </div>
                                        ) : (
                                            <div className="flex gap-1 items-center">
                                                <span className="font-mono text-xs">{item.Ubicazioni}</span>
                                                <button 
                                                    onClick={() => setEditingItems(prev => ({ ...prev, [item.Seriale_Riscontrato]: true }))} 
                                                    className="text-blue-500 hover:text-blue-700"
                                                >
                                                    <Icons.Edit />
                                                </button>
                                            </div>
                                        )}
                                    </td>
                                    
                                    <td className={`px-3 py-2 font-mono text-xs ${!visibleColumns.serialeAtteso ? 'col-hidden' : ''}`}>{item.RISCONTROSERIALEF || '-'}</td>
                                    <td className={`px-3 py-2 ${!visibleColumns.partNumber ? 'col-hidden' : ''}`}>
    {editingPartNumber[item.Seriale_Riscontrato] ? (
        <div className="flex gap-1">
            <input 
                type="text" 
                defaultValue={item.PartNumber} 
                onBlur={(e) => updatePartNumberStorico(item, e.target.value)} 
                className="px-2 py-1 border rounded text-xs w-32" 
                autoFocus 
            />
        </div>
    ) : (
        <div className="flex gap-1 items-center">
            <span className="font-mono text-xs">{item.PartNumber || '-'}</span>
            <button 
                onClick={() => setEditingPartNumber(prev => ({ ...prev, [item.Seriale_Riscontrato]: true }))} 
                className="text-blue-500 hover:text-blue-700"
            >
                <Icons.Edit />
            </button>
        </div>
    )}
</td>
                                    <td className={`px-3 py-2 font-mono text-xs font-bold ${!visibleColumns.serialeRiscontrato ? 'col-hidden' : ''}`}>{item.Seriale_Riscontrato}</td>
                                    <td className={`px-3 py-2 ${!visibleColumns.match ? 'col-hidden' : ''}`}>
                                        {item.Match === 'OK' ? (
                                            <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-medium">
                                                <Icons.CheckCircle /> OK
                                            </span>
                                        ) : (
                                            <span className="inline-flex items-center gap-1 px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-medium">
                                                <Icons.XCircle /> KO
                                            </span>
                                        )}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
            <p className="text-gray-600">Visualizzati: <strong>{filteredData.length}</strong> di <strong>{storico.length}</strong> riscontri</p>
        </div>
    );
}
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
