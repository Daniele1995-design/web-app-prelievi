    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // 1. CONFIGURAZIONE SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://gggkjzbggdaujoyxmvxa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnZ2tqemJnZ2RhdWpveXhtdnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwMjY3NjcsImV4cCI6MjA4MzYwMjc2N30.8Qikb54_UnZdVj71mISuoZytByI2sosk57noLebU76A';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // 2. ADAPTER (IL SEGRETO PER MANTENERE IL CODICE UGUALE)
        // ============================================
        // Queste funzioni trasformano i dati di Supabase (snake_case)
        // nel formato che la tua app React si aspetta (PascalCase)
        
        function normalizeGiacenza(data) {
            return data.map(item => ({
                ID_Riga: item.id_riga,
                PoNr: item.po_nr,
                Cdc: item.cdc,
                CodSap: item.cod_sap,
                Descrizione: item.descrizione,
                'SerS/No': item.ser_sn, 
                Stato: item.stato,
                Ubicazioni: item.ubicazioni,
                WMSCode: item.wms_code,
                RISCONTROSERIALEF: item.riscontro_seriale_f, // Fondamentale
                PartNumber: item.part_number,
                inventariato: item.stato === 'INVENTARIATO',
                Match: item.match,
                'Qtà': item.qta
            }));
        }

        function normalizeStorico(data) {
            return data.map(item => ({
                id: item.id,
                Timestamp: item.timestamp,
                Operatore: item.operatore,
                CodSap: item.cod_sap,
                Descrizione: item.descrizione,
                Ubicazioni: item.ubicazione,
                Seriale_Riscontrato: item.seriale_riscontrato,
                RISCONTROSERIALEF: item.seriale_atteso,
                Match: item.match ? 'OK' : 'KO',
                WMSCode: item.wms_code,
                Cdc: item.cdc,
                PoNr: item.po_nr,
                PartNumber: item.part_number,
                Stato: item.match ? 'INVENTARIATO' : 'ERRORE'
            }));
        }

        // ============================================
        // 3. NUOVA FUNZIONE API (SOSTITUISCE GOOGLE)
        // ============================================
        async function api(action, payload = {}, isBatch = false) {
            try {
                switch (action) {
                    case 'login':
                        // Login semplificato per ora (o crea tabella 'utenti')
                        // Se non hai tabella utenti, usa questo dummy per testare:
                        // return { user: { nome: payload.username } }; 
                        
                        const { data: user, error: lErr } = await supabase
                            .from('utenti')
                            .select('*')
                            .eq('username', payload.username)
                            .eq('password', payload.password)
                            .single();
                        if (lErr || !user) throw new Error('Credenziali errate');
                        return { user };

                    case 'getGiacenza':
                        const { data: gData, error: gErr } = await supabase
                            .from('giacenza')
                            .select('*');
                        if (gErr) throw gErr;
                        return { data: normalizeGiacenza(gData) };

                    case 'getStorico':
                        const { data: sData, error: sErr } = await supabase
                            .from('inventario')
                            .select('*')
                            .order('timestamp', { ascending: false })
                            .limit(3000); // Scarica gli ultimi 3000
                        if (sErr) throw sErr;
                        return { data: normalizeStorico(sData) };

                    case 'saveRiscontro': 
                    case 'registraScansione':
                        // Gestisce sia input singolo che oggetto 'data'
                        const scanData = payload.data || payload;
                        
                        // Insert Inventario
                        const { error: iErr } = await supabase.from('inventario').insert([{
                            operatore: scanData.operatore,
                            cod_sap: scanData.codSap,
                            descrizione: scanData.descrizione,
                            ubicazione: scanData.ubicazione,
                            seriale_atteso: scanData.serialeAtteso,
                            seriale_riscontrato: scanData.serialeRiscontrato,
                            match: scanData.match === 'OK' || scanData.match === true,
                            qta: 1,
                            wms_code: scanData.wmsCode,
                            cdc: scanData.cdc,
                            po_nr: scanData.poNr,
                            part_number: scanData.partNumber,
                            id_riga_giacenza: scanData.idRigaGiacenza
                        }]);
                        if (iErr) throw iErr;

                        // Update Giacenza se OK
                        if (scanData.match === 'OK' || scanData.match === true) {
                            await supabase.from('giacenza')
                                .update({ stato: 'INVENTARIATO', match: 'OK' })
                                .eq('riscontro_seriale_f', scanData.serialeRiscontrato);
                        }
                        return { success: true };

                    case 'updateUbicazione':
                        // Aggiorna entrambe le tabelle
                        await supabase.from('giacenza')
                            .update({ ubicazioni: payload.ubicazione })
                            .eq('riscontro_seriale_f', payload.seriale);
                        await supabase.from('inventario')
                            .update({ ubicazione: payload.ubicazione })
                            .eq('seriale_riscontrato', payload.seriale);
                        return { success: true };

                    case 'updatePartNumber':
                         await supabase.from('giacenza')
                            .update({ part_number: payload.partNumber })
                            .eq('riscontro_seriale_f', payload.seriale);
                         await supabase.from('inventario')
                            .update({ part_number: payload.partNumber })
                            .eq('seriale_riscontrato', payload.seriale);
                         return { success: true };

                    case 'batchUpdateUbicazione':
                        // Per le modifiche massive (loop ottimizzato)
                        for (let item of payload.updates) {
                            await api('updateUbicazione', item);
                        }
                        return { success: true };

                    case 'batchUpdatePartNumber':
                        for (let item of payload.updates) {
                             await api('updatePartNumber', item);
                        }
                        return { success: true };

                    default:
                        console.warn("Azione API non gestita:", action);
                        return { success: true };
                }
            } catch (err) {
                console.error("SUPABASE ERROR:", err);
                throw err;
            }
        }

        // ============================================
        // 4. DB CACHE & QUEUE (DAL TUO FILE ORIGINALE)
        // ============================================
        const DB_NAME = 'ATSInventoryDB_SB'; // Nuovo DB locale
        const DB_VERSION = 1;

        const dbCache = {
            db: null,
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => { this.db = request.result; resolve(); };
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('giacenza')) db.createObjectStore('giacenza', { keyPath: 'ID_Riga' });
                        if (!db.objectStoreNames.contains('storico')) {
                            const store = db.createObjectStore('storico', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('seriale', 'Seriale_Riscontrato', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('metadata')) db.createObjectStore('metadata', { keyPath: 'key' });
                    };
                });
            },
            async get(storeName) {
                if (!this.db) await this.init();
                return new Promise((res, rej) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).getAll();
                    req.onsuccess = () => res(req.result || []);
                    req.onerror = () => rej(req.error);
                });
            },
            async set(storeName, data) {
                if (!this.db) await this.init();
                return new Promise((res, rej) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.clear();
                    data.forEach(item => store.add(item));
                    tx.oncomplete = () => res();
                    tx.onerror = () => rej(tx.error);
                });
            },
            async setMetadata(key, value) {
                if (!this.db) await this.init();
                const tx = this.db.transaction('metadata', 'readwrite');
                tx.objectStore('metadata').put({ key, value });
            },
            async getMetadata(key) {
                if (!this.db) await this.init();
                return new Promise(res => {
                    const req = this.db.transaction('metadata', 'readonly').objectStore('metadata').get(key);
                    req.onsuccess = () => res(req.result?.value);
                });
            },
            async clearAll() {
                if (!this.db) await this.init();
                ['giacenza', 'storico', 'metadata'].forEach(s => {
                    this.db.transaction(s, 'readwrite').objectStore(s).clear();
                });
            }
        };

        const appCache = { giacenza: null, storico: null, stats: null };

        const operationQueue = {
            queue: [],
            processing: false,
            batchTimer: null,
            async add(action, payload, retries = 3) {
                this.queue.push({ action, payload, retries, timestamp: Date.now() });
                clearTimeout(this.batchTimer);
                this.batchTimer = setTimeout(() => { if (!this.processing) this.process(); }, 500);
            },
            async process() {
                if (this.queue.length === 0) { this.processing = false; return; }
                this.processing = true;
                // Semplificato: processa uno alla volta per sicurezza con Supabase
                const op = this.queue[0];
                try {
                    await api(op.action, op.payload);
                    this.queue.shift(); // Rimuovi solo se successo
                    console.log('✅ Operazione completata:', op.action);
                } catch (err) {
                    console.error('❌ Errore queue:', err);
                    op.retries--;
                    if (op.retries <= 0) this.queue.shift(); // Rimuovi se troppi errori
                    await new Promise(r => setTimeout(r, 2000));
                }
                this.processing = false;
                if (this.queue.length > 0) setTimeout(() => this.process(), 200);
            }
        };

        // ============================================
        // 5. COMPONENTI REACT (100% ORIGINALI)
        // ============================================
        
        const Icons = {
            Camera: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
            Package: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
            List: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
            BarChart: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
            Printer: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            CheckCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            XCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Filter: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
        };

        function App() {
            const [user, setUser] = useState(() => {
                const saved = sessionStorage.getItem('ats_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [currentView, setCurrentView] = useState(sessionStorage.getItem('ats_view') || 'login');
            const [queueSize, setQueueSize] = useState(0);

            useEffect(() => {
                if (user) { sessionStorage.setItem('ats_user', JSON.stringify(user)); sessionStorage.setItem('ats_view', currentView); }
            }, [user, currentView]);

            useEffect(() => {
                const interval = setInterval(() => setQueueSize(operationQueue.queue.length), 1000);
                return () => clearInterval(interval);
            }, []);

            const handleLogout = () => { setUser(null); setCurrentView('login'); sessionStorage.clear(); dbCache.clearAll(); };
            const handleForceRefresh = async () => {
                if (!confirm('Ricaricare tutti i dati dal server?')) return;
                await dbCache.clearAll();
                location.reload();
            };

            if (!user || currentView === 'login') return <Login onLogin={(u) => { setUser(u); setCurrentView('dashboard'); }} />;

            return (
                <div className="min-h-screen bg-gray-100 no-print">
                    <header className="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center">
                        <div><h1 className="text-2xl font-bold">Inventario ATS</h1><p className="text-sm opacity-90">{user.nome}</p></div>
                        <div className="flex gap-2">
                            {queueSize > 0 && <div className="bg-yellow-500 px-4 py-2 rounded font-medium">⏳ {queueSize} in coda</div>}
                            <button onClick={handleForceRefresh} className="bg-yellow-500 px-4 py-2 rounded hover:bg-yellow-600">🔄 Refresh</button>
                            <button onClick={handleLogout} className="bg-red-500 px-4 py-2 rounded hover:bg-red-600"><Icons.LogOut /> Esci</button>
                        </div>
                    </header>
                    <nav className="bg-white shadow-md">
                        <div className="max-w-7xl mx-auto flex overflow-x-auto">
                            <NavButton icon={<Icons.BarChart />} label="Dashboard" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                            <NavButton icon={<Icons.Camera />} label="Scanner" active={currentView === 'scanner'} onClick={() => setCurrentView('scanner')} />
                            <NavButton icon={<Icons.List />} label="Lista" active={currentView === 'lista'} onClick={() => setCurrentView('lista')} />
                            <NavButton icon={<Icons.Package />} label="Storico" active={currentView === 'storico'} onClick={() => setCurrentView('storico')} />
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto p-4">
                        {currentView === 'dashboard' && <Dashboard />}
                        {currentView === 'scanner' && <ModeScanner user={user} />}
                        {currentView === 'lista' && <ModeLista user={user} />}
                        {currentView === 'storico' && <Storico />}
                    </main>
                </div>
            );
        }

        function NavButton({ icon, label, active, onClick }) {
            return <button onClick={onClick} className={`flex items-center gap-2 px-6 py-3 border-b-4 transition ${active ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-600 hover:bg-gray-50'}`}>{icon}<span className="font-medium">{label}</span></button>;
        }

        function Login({ onLogin }) {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [loading, setLoading] = useState(false);
            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const res = await api('login', { username: u, password: p });
                    onLogin(res.user);
                } catch (e) { alert(e.message); } finally { setLoading(false); }
            };
            return (
                <div className="min-h-screen bg-blue-600 flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded shadow-xl w-full max-w-sm">
                        <h1 className="text-2xl font-bold mb-6 text-center text-gray-800">Inventario ATS</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input className="w-full border p-3 rounded" placeholder="Username" value={u} onChange={e => setU(e.target.value)} />
                            <input className="w-full border p-3 rounded" type="password" placeholder="Password" value={p} onChange={e => setP(e.target.value)} />
                            <button disabled={loading} className="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">{loading ? 'Accesso...' : 'Accedi'}</button>
                        </form>
                    </div>
                </div>
            );
        }

        function Dashboard() {
            const [stats, setStats] = useState(null);
            useEffect(() => {
                const load = async () => {
                    const localG = await dbCache.get('giacenza');
                    if (localG.length > 0) {
                        const tot = localG.length;
                        const inv = localG.filter(i => i.inventariato).length;
                        setStats({ tot, inv, todo: tot - inv, match: localG.filter(i => i.Match === 'OK').length, perc: Math.round((inv / tot) * 100) });
                    } else {
                        // Primo caricamento
                        const res = await api('getGiacenza');
                        await dbCache.set('giacenza', res.data);
                        location.reload(); // Ricarica per popolare le stats
                    }
                };
                load();
                const interval = setInterval(load, 10000);
                return () => clearInterval(interval);
            }, []);

            if (!stats) return <div className="text-center py-12">Caricamento stats...</div>;

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <StatCard title="Totale Giacenza" value={stats.tot} icon="📦" color="bg-blue-500" />
                    <StatCard title="Inventariato" value={stats.inv} icon="✅" color="bg-green-500" />
                    <StatCard title="Da Inventariare" value={stats.todo} icon="⏳" color="bg-yellow-500" />
                    <StatCard title="Match OK" value={stats.match} icon="🎯" color="bg-purple-500" />
                    <div className="col-span-full bg-white rounded shadow p-6">
                        <div className="flex justify-between mb-2"><span className="font-bold">Avanzamento</span><span className="font-bold text-blue-600">{stats.perc}%</span></div>
                        <div className="w-full bg-gray-200 h-4 rounded-full"><div className="bg-blue-600 h-4 rounded-full transition-all" style={{ width: `${stats.perc}%` }}></div></div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, color }) {
            return (
                <div className="bg-white rounded shadow p-6 border-l-4 border-transparent hover:border-blue-500 transition">
                    <div className="flex justify-between mb-2"><span className="text-gray-500 font-medium">{title}</span><span className="text-2xl">{icon}</span></div>
                    <p className={`text-3xl font-bold ${color.replace('bg-', 'text-')}`}>{value}</p>
                </div>
            );
        }

        function ModeScanner({ user }) {
            const [scanInput, setScanInput] = useState('');
            const [giacenza, setGiacenza] = useState([]);
            const [currentItem, setCurrentItem] = useState(null);
            const [message, setMessage] = useState({ type: '', text: '' });
            const [formatoStampa, setFormatoStampa] = useState('10x10');
            const [editingUbicazione, setEditingUbicazione] = useState(false);
            const [newUbicazione, setNewUbicazione] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                const init = async () => {
                    let g = await dbCache.get('giacenza');
                    if (g.length === 0) { const res = await api('getGiacenza'); g = res.data; await dbCache.set('giacenza', g); }
                    setGiacenza(g);
                };
                init();
                inputRef.current?.focus();
            }, []);

            const playBeep = (type) => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.frequency.value = type === 'success' ? 800 : 300;
                osc.type = 'square';
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            };

            const handleScan = async (e) => {
                if (e.key === 'Enter' && scanInput.trim()) {
                    const code = scanInput.trim().toUpperCase();
                    setScanInput('');
                    
                    const found = giacenza.find(i => String(i.RISCONTROSERIALEF).toUpperCase() === code && !i.inventariato);
                    const already = giacenza.find(i => String(i.RISCONTROSERIALEF).toUpperCase() === code && i.inventariato);

                    if (already) {
                        setMessage({ type: 'warning', text: '⚠️ GIÀ INVENTARIATO' });
                        playBeep('error');
                    } else if (found) {
                        const newItem = { ...found, inventariato: true, Match: 'OK' };
                        const updatedG = giacenza.map(i => i.ID_Riga === found.ID_Riga ? newItem : i);
                        setGiacenza(updatedG);
                        setCurrentItem(newItem);
                        setNewUbicazione(found.Ubicazioni || '');
                        setMessage({ type: 'success', text: '✅ MATCH OK' });
                        playBeep('success');
                        await dbCache.set('giacenza', updatedG);

                        operationQueue.add('registraScansione', {
                            operatore: user.nome,
                            codSap: found.CodSap,
                            descrizione: found.Descrizione,
                            ubicazione: found.Ubicazioni,
                            serialeAtteso: found.RISCONTROSERIALEF,
                            serialeRiscontrato: code,
                            match: 'OK',
                            wmsCode: found.WMSCode,
                            idRigaGiacenza: found.ID_Riga,
                            poNr: found.PoNr,
                            partNumber: found.PartNumber,
                            cdc: found.Cdc
                        });
                    } else {
                        setMessage({ type: 'error', text: '❌ NON TROVATO' });
                        playBeep('error');
                    }
                    setTimeout(() => setMessage({ type: '', text: '' }), 3000);
                }
            };

            const updateUbicazione = async () => {
                if (!currentItem) return;
                const updatedG = giacenza.map(i => i.ID_Riga === currentItem.ID_Riga ? { ...i, Ubicazioni: newUbicazione } : i);
                setGiacenza(updatedG);
                setCurrentItem({ ...currentItem, Ubicazioni: newUbicazione });
                setEditingUbicazione(false);
                await dbCache.set('giacenza', updatedG);
                operationQueue.add('updateUbicazione', { seriale: currentItem.RISCONTROSERIALEF, ubicazione: newUbicazione });
            };

            const stampaEtichetta = (item) => {
                const printArea = document.getElementById('print-area');
                const bcId = 'bc-' + Date.now();
                let html = '';
                
                // LOGICA STAMPA ORIGINALE
                if (formatoStampa === '10x10') {
                    html = `<div class="etichetta-10x10">
                        <div class="logo-container"><img class="logo-img" src="https://raw.githubusercontent.com/Daniele1995-design/WebAppSap/refs/heads/main/logo%20ats.jpg"><div class="label-cod-bp">COD BP</div></div>
                        <div class="bp-section"><div class="bp-label">Codice BP</div><div class="bp-value">${item.CodSap}</div><img class="qr-bp" src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${item.CodSap}"></div>
                        <hr><div class="art-label">Articolo</div><svg class="barcode-svg" id="${bcId}"></svg><div class="wms">${item.WMSCode}</div>
                        <hr><div class="po-row"><div><span class="po-label">Po Nr</span> <span class="po-value">${item.PoNr}</span></div><div><span class="po-label">Pos</span> <span class="po-value">${item.Cdc}</span></div></div>
                        <div class="label-tpn">TPN</div><hr class="thin">
                        <div class="part-section"><span class="part-label">Part Number</span><span class="part-value">${item.PartNumber || ''}</span></div>
                        <div class="sn-section"><span class="sn-label">SN</span><span class="sn-value">${item.RISCONTROSERIALEF}</span><img class="qr-sn" src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${item.RISCONTROSERIALEF}"></div>
                        <div class="ubicazione-under-sn"><span class="pos-label">Ubicazione</span><div class="pos-value">${item.Ubicazioni}</div></div>
                    </div>`;
                } else if (formatoStampa === '10x5') {
                    html = `<div class="etichetta-10x5">
                        <img class="et5-logo" src="https://raw.githubusercontent.com/Daniele1995-design/WebAppSap/refs/heads/main/logo%20ats.jpg">
                        <div class="et5-codbp">${item.CodSap}</div><svg class="et5-barcode" id="${bcId}"></svg>
                        <div class="et5-info"><div>${item.PoNr}<br>${item.RISCONTROSERIALEF}</div><img class="et5-qr-sn" src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${item.RISCONTROSERIALEF}"></div>
                    </div>`;
                }

                printArea.innerHTML = html;
                printArea.style.display = 'block';
                const imgs = Array.from(printArea.querySelectorAll('img'));
                Promise.all(imgs.map(img => new Promise(resolve => {
                    if (img.complete) resolve(); else { img.onload = resolve; img.onerror = resolve; }
                }))).then(() => {
                    JsBarcode('#' + bcId, item.WMSCode, { format: "CODE128", height: 20, width: 1.5, displayValue: false, margin: 0 });
                    setTimeout(() => { window.print(); printArea.style.display = 'none'; }, 500);
                });
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded shadow">
                        <h2 className="text-xl font-bold mb-4">Scannerizza Barcode</h2>
                        <input ref={inputRef} value={scanInput} onChange={e => setScanInput(e.target.value)} onKeyDown={handleScan} className="w-full text-2xl border-2 border-blue-500 rounded p-4 shadow-inner" placeholder="Spara qui..." autoFocus />
                    </div>
                    {message.text && <div className={`p-6 text-white text-2xl font-bold text-center rounded-lg shadow ${message.type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>{message.text}</div>}
                    
                    {currentItem && (
                        <div className="bg-white p-6 rounded shadow-lg border-2 border-blue-100">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h3 className="text-xl font-bold text-gray-800">Dettaglio Articolo</h3>
                                <div className="flex gap-2">
                                    <select value={formatoStampa} onChange={e => setFormatoStampa(e.target.value)} className="border rounded px-2">
                                        <option value="10x10">10x10</option><option value="10x5">10x5</option><option value="10x10g">10x10G</option>
                                    </select>
                                    <button onClick={() => stampaEtichetta(currentItem)} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex gap-2"><Icons.Printer /> Stampa</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs text-gray-500">Cod. SAP</label><p className="font-bold text-lg">{currentItem.CodSap}</p></div>
                                <div><label className="text-xs text-gray-500">Po Nr</label><p className="font-bold">{currentItem.PoNr}</p></div>
                                <div className="col-span-2"><label className="text-xs text-gray-500">Descrizione</label><p className="font-bold">{currentItem.Descrizione}</p></div>
                                <div className="col-span-2">
                                    <label className="text-xs text-gray-500">Ubicazione</label>
                                    {editingUbicazione ? (
                                        <div className="flex gap-2">
                                            <input value={newUbicazione} onChange={e => setNewUbicazione(e.target.value)} className="border p-2 rounded flex-1" />
                                            <button onClick={updateUbicazione} className="bg-green-500 text-white px-3 rounded">OK</button>
                                        </div>
                                    ) : (
                                        <div className="flex justify-between items-center">
                                            <p className="font-bold text-xl">{currentItem.Ubicazioni}</p>
                                            <button onClick={() => setEditingUbicazione(true)} className="text-blue-500"><Icons.Edit /></button>
                                        </div>
                                    )}
                                </div>
                                <div className="col-span-2 bg-green-50 p-2 rounded text-center"><p className="text-green-800 font-mono font-bold text-xl">{currentItem.RISCONTROSERIALEF}</p></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ModeLista({ user }) {
            const [giacenza, setGiacenza] = useState([]);
            const [selected, setSelected] = useState([]);
            const [filters, setFilters] = useState({});
            const [showCol, setShowCol] = useState(false);
            const [cols, setCols] = useState({ poNr: true, cdc: true, codSap: true, desc: true, ub: true, sn: true });
            
            useEffect(() => {
                const load = async () => {
                    let g = await dbCache.get('giacenza');
                    if(g.length === 0) { const res = await api('getGiacenza'); g = res.data; await dbCache.set('giacenza', g); }
                    setGiacenza(g.filter(i => !i.inventariato));
                };
                load();
            }, []);

            const filtered = giacenza.filter(i => {
                if (filters.poNr && !i.PoNr.includes(filters.poNr)) return false;
                if (filters.codSap && !i.CodSap.includes(filters.codSap)) return false;
                return true;
            });

            const handleMassive = async () => {
                if (!confirm(`Confermi ${selected.length} articoli?`)) return;
                const newG = await dbCache.get('giacenza');
                for (let item of selected) {
                    const idx = newG.findIndex(x => x.ID_Riga === item.ID_Riga);
                    if (idx >= 0) { newG[idx].inventariato = true; newG[idx].Match = 'OK'; }
                    operationQueue.add('registraScansione', {
                        operatore: user.nome,
                        codSap: item.CodSap,
                        descrizione: item.Descrizione,
                        ubicazione: item.Ubicazioni,
                        serialeAtteso: item.RISCONTROSERIALEF,
                        serialeRiscontrato: item.RISCONTROSERIALEF,
                        match: 'OK',
                        idRigaGiacenza: item.ID_Riga,
                        partNumber: item.PartNumber
                    });
                }
                await dbCache.set('giacenza', newG);
                setGiacenza(newG.filter(i => !i.inventariato));
                setSelected([]);
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between">
                        <h2 className="text-xl font-bold">Lista Giacenza ({filtered.length})</h2>
                        <div className="flex gap-2">
                             <button onClick={() => setShowCol(!showCol)} className="bg-gray-200 px-3 py-1 rounded">👁️ Colonne</button>
                             {selected.length > 0 && <button onClick={handleMassive} className="bg-green-600 text-white px-4 py-2 rounded shadow">Conferma ({selected.length})</button>}
                        </div>
                    </div>
                    
                    {showCol && (
                        <div className="bg-white p-4 shadow rounded flex gap-4">
                            <label><input type="checkbox" checked={cols.poNr} onChange={() => setCols({...cols, poNr: !cols.poNr})} /> Po Nr</label>
                            <label><input type="checkbox" checked={cols.codSap} onChange={() => setCols({...cols, codSap: !cols.codSap})} /> SAP</label>
                        </div>
                    )}

                    <div className="bg-white shadow rounded overflow-hidden">
                        <div className="p-2 bg-gray-50 flex gap-2">
                            <input placeholder="Filtra SAP..." className="border p-1 rounded" onChange={e => setFilters({...filters, codSap: e.target.value})} />
                            <input placeholder="Filtra PO..." className="border p-1 rounded" onChange={e => setFilters({...filters, poNr: e.target.value})} />
                        </div>
                        <div className="overflow-auto max-h-[600px]">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-100 sticky top-0">
                                    <tr>
                                        <th className="p-2"><input type="checkbox" onChange={e => setSelected(e.target.checked ? filtered : [])} /></th>
                                        {cols.poNr && <th className="p-2">Po Nr</th>}
                                        {cols.cdc && <th className="p-2">CDC</th>}
                                        {cols.codSap && <th className="p-2">SAP</th>}
                                        {cols.desc && <th className="p-2">Descrizione</th>}
                                        {cols.ub && <th className="p-2">Ubicazione</th>}
                                        {cols.sn && <th className="p-2">Seriale</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.slice(0, 100).map(r => (
                                        <tr key={r.ID_Riga} className="border-b hover:bg-gray-50">
                                            <td className="p-2"><input type="checkbox" checked={selected.includes(r)} onChange={e => {
                                                if(e.target.checked) setSelected([...selected, r]); else setSelected(selected.filter(x => x !== r));
                                            }} /></td>
                                            {cols.poNr && <td className="p-2">{r.PoNr}</td>}
                                            {cols.cdc && <td className="p-2">{r.Cdc}</td>}
                                            {cols.codSap && <td className="p-2 font-mono font-bold">{r.CodSap}</td>}
                                            {cols.desc && <td className="p-2">{r.Descrizione}</td>}
                                            {cols.ub && <td className="p-2">{r.Ubicazioni}</td>}
                                            {cols.sn && <td className="p-2 font-mono">{r.RISCONTROSERIALEF}</td>}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function Storico() {
            const [data, setData] = useState([]);
            useEffect(() => {
                const load = async () => {
                    const res = await api('getStorico');
                    setData(res.data);
                };
                load();
            }, []);

            return (
                <div className="bg-white shadow rounded overflow-hidden">
                    <h2 className="p-4 font-bold border-b">Storico Ultimi Movimenti</h2>
                    <div className="overflow-auto max-h-[600px]">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-100 sticky top-0">
                                <tr><th className="p-3">Data</th><th className="p-3">Operatore</th><th className="p-3">SAP</th><th className="p-3">Seriale</th><th className="p-3">Esito</th></tr>
                            </thead>
                            <tbody>
                                {data.map(r => (
                                    <tr key={r.id} className="border-b hover:bg-gray-50">
                                        <td className="p-3">{new Date(r.Timestamp).toLocaleString()}</td>
                                        <td className="p-3 font-medium">{r.Operatore}</td>
                                        <td className="p-3">{r.CodSap}</td>
                                        <td className="p-3 font-mono">{r.Seriale_Riscontrato}</td>
                                        <td className="p-3">{r.Match === 'OK' ? <span className="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">OK</span> : <span className="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold">KO</span>}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
