        function normalizeGiacenza(data) {
            if (!data) return [];
            return data.map(item => ({
                ID_Riga: item.id_riga,
                PoNr: item.po_nr || '',
                Cdc: item.cdc || '',
                CodSap: item.cod_sap || '',

            }));
        }

        function normalizeStorico(data) {
    if (!data) return [];

        // ✅ Sincronizza giacenza con inventario usando ID_Riga
async function syncGiacenzaWithInventario(giacenzaData) {
    try {

        // ============================================
        // API BRIDGE - TUTTE LE OPERAZIONI SUPABASE
        // ============================================
        
        // Helper per scaricare TUTTE le righe (bypass limite 1000)
        async function fetchAllRows(tableName, filters = {}) {
            let allData = [];
            let from = 0;
            const step = 1000;
            
            while(true) {
                let query = supabaseClient
                    .from(tableName)
                    .select('*')
                    .range(from, from + step - 1);
                
                // Applica filtri se presenti
                Object.keys(filters).forEach(key => {
                    if (filters[key]) query = query.eq(key, filters[key]);
                });
                
                const { data, error } = await query;
                
                if (error) throw error;
                if (!data || data.length === 0) break;
                
                allData = allData.concat(data);
                
                if (data.length < step) break; 
                from += step;
            }
            
            return allData;
        }

      async function api(action, payload = {}) {

                return { user };

case 'getGiacenza':
    const gData = await fetchAllRows('giacenza');
    const normalized = normalizeGiacenza(gData);
    const synced = await syncGiacenzaWithInventario(normalized); // ✅ Sync con inventario
    return { data: synced };

            case 'getStats':
                const { count: tot } = await supabaseClient
                    .from('giacenza')
                    .select('*', { count: 'exact', head: true });
                
                const { count: inv } = await supabaseClient
                    .from('giacenza')
                    .select('*', { count: 'exact', head: true })
                    .eq('stato', 'INVENTARIATO');
                
                const { count: matchOk } = await supabaseClient
                    .from('giacenza')
                    .select('*', { count: 'exact', head: true })
                    .eq('match', 'OK');
                
                return { 
                    stats: {
                        totaleGiacenza: tot || 0,
                        totaleInventariato: inv || 0,
                        daInventariare: (tot || 0) - (inv || 0),
                        matchOk: matchOk || 0,
                        percentualeCompletamento: tot > 0 ? Math.round((inv/tot)*100) : 0
                    }
                };

            case 'getStorico':
    const sData = await fetchAllRows('inventario');
    // Ordina per timestamp decrescente (più recenti prima)
    sData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    return { data: normalizeStorico(sData) };

           case 'saveRiscontro':

            id_riga_giacenza: sd.idRigaGiacenza,
            note: sd.note || '',
            stato: sd.stato,

        // ============================================
        // INDEXEDDB CACHE MANAGER
        // ============================================
        const DB_NAME = 'ATSInventoryDB_SB';
        const DB_VERSION = 1;

        const dbCache = {
            db: null,
            
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };
                    
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        
                        if (!db.objectStoreNames.contains('giacenza')) {
                            db.createObjectStore('giacenza', { keyPath: 'ID_Riga' });
                        }
                        if (!db.objectStoreNames.contains('storico')) {
                            const store = db.createObjectStore('storico', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('seriale', 'Seriale_Riscontrato', { unique: false });
                            store.createIndex('timestamp', 'Timestamp', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('metadata')) {
                            db.createObjectStore('metadata', { keyPath: 'key' });
                        }
                    };
                });
            },
            
            async get(storeName) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            },
            
            async set(storeName, data) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    
                    store.clear();
                    data.forEach(item => store.add(item));
                    
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            },
            
            async getMetadata(key) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('metadata', 'readonly');
                    const store = tx.objectStore('metadata');
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result?.value);
                    request.onerror = () => reject(request.error);
                });
            },
            
            async setMetadata(key, value) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('metadata', 'readwrite');
                    const store = tx.objectStore('metadata');
                    const request = store.put({ key, value });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            
            async clearAll() {
                if (!this.db) await this.init();
                const stores = ['giacenza', 'storico', 'metadata'];
                for (const store of stores) {
                    await new Promise((resolve, reject) => {
                        const tx = this.db.transaction(store, 'readwrite');
                        const request = tx.objectStore(store).clear();
                        request.onsuccess = () => resolve();
                        request.onerror = () => reject(request.error);
                    });
                }
            }
        };

           // ============================================
        // QUEUE MANAGER OTTIMIZZATO
        // ============================================
        const operationQueue = {
            queue: [],
            processing: false,
            batchTimer: null,
            
            async add(action, payload, retries = 3) {
                this.queue.push({ action, payload, retries, timestamp: Date.now() });
                
                clearTimeout(this.batchTimer);
                this.batchTimer = setTimeout(() => {
                    if (!this.processing) this.process();
                }, 300);
            },
            
            async process() {
                if (this.queue.length === 0) {
                    this.processing = false;
                    return;
                }
                
                this.processing = true;
                const batches = this.groupOperations();
                
                for (const batch of batches) {
                    try {
                        if (batch.action === 'updateUbicazione') {
                            const payload = {
                                updates: batch.operations.map(op => ({
                                    seriale: op.payload.seriale,
                                    ubicazione: op.payload.ubicazione
                                }))
                            };
                            await api('batchUpdateUbicazione', payload);
                        } else if (batch.action === 'updatePartNumber') {
                            const payload = {
                                updates: batch.operations.map(op => ({
                                    seriale: op.payload.seriale,
                                    partNumber: op.payload.partNumber
                                }))
                            };
                            await api('batchUpdatePartNumber', payload);
                        } else {
                            for (const op of batch.operations) {
                                await api(op.action, op.payload);
                            }
                        }
                        
                        batch.operations.forEach(op => {
                            this.queue = this.queue.filter(q => q.timestamp !== op.timestamp);
                        });
                        
                        console.log(`✅ Batch ${batch.action} completato (${batch.operations.length} items)`);
                    } catch (err) {
                        console.warn('⚠️ Errore batch:', err);
                        for (const op of batch.operations) {
                            op.retries--;
                            if (op.retries <= 0) {
                                this.queue = this.queue.filter(q => q.timestamp !== op.timestamp);
                                console.error('❌ Operazione fallita:', op.action);
                            }
                        }
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                this.processing = false;
                
                if (this.queue.length > 0) {
                    setTimeout(() => this.process(), 200);
                }
            },
            
            groupOperations() {
                const groups = {};
                this.queue.forEach(op => {
                    if (!groups[op.action]) groups[op.action] = [];
                    groups[op.action].push(op);
                });
                
                return Object.keys(groups).map(
                    action => ({
action,
operations: groups[action]
}));
}
};

                gain.connect(ctx.destination);
                osc.frequency.value = type === 'success' ? 800 : 400;
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();

            const applyFilters = () => {
    // ✅ Usa UN SOLO ciclo invece di filter multipli
    const filtered = giacenza.reduce((acc, i) => {
        // Controlla inventariato
        if (i.inventariato) return acc;
        
        // Applica tutti i filtri in un solo check
        if (filters.cdc && !(i.Cdc || '').toUpperCase().includes(filters.cdc.toUpperCase())) return acc;
        if (filters.codSap && (i.CodSap || '').toUpperCase() !== filters.codSap.toUpperCase()) return acc;

        acc.push(i);
        return acc;

const toggleSelectWithShift = (item, index, event) => {
    if (event.shiftKey && lastSelectedIndex !== null) {
        // Seleziona range da lastSelectedIndex a index
        const start = Math.min(lastSelectedIndex, index);
        const end = Math.max(lastSelectedIndex, index);
        const rangeItems = displayedData.slice(start, end + 1);
        
        setSelected(prev => {
            // Rimuovi duplicati e aggiungi nuovi
            const existingIds = new Set(prev.map(i => i.ID_Riga));
            const newItems = rangeItems.filter(i => !existingIds.has(i.ID_Riga));
            return [...prev, ...newItems];
        });
    } else {
        // Selezione singola normale
        setSelected(prev => 
            prev.find(i => i.ID_Riga === item.ID_Riga) 
                ? prev.filter(i => i.ID_Riga !== item.ID_Riga) 
                : [...prev, item]
        );
    }
    setLastSelectedIndex(index);
};

    function Storico({ user }) {
        const [storico, setStorico] = useState([]);
        const [filteredData, setFilteredData] = useState([]);
        const [filters, setFilters] = useState({});
        const [loading, setLoading] = useState(true);
        const [loadingProgress, setLoadingProgress] = useState('');
        const [showFilters, setShowFilters] = useState(false);
        const [editingItems, setEditingItems] = useState({});

        const [editingNote, setEditingNote] = useState({});

        const [bulkPartNumber, setBulkPartNumber] = useState('');
        const [formatoStampa, setFormatoStampa] = useState('10x10');
        
        const [showColumnSelector, setShowColumnSelector] = useState(false);
        const [visibleColumns, setVisibleColumns] = useState({
            dataOra: true,
            operatore: true,
            poNr: true,
            codSap: true,
            descrizione: false,
            cdc: true,
             stato: true,
            ubicazione: true,
            serialeAtteso: false,
            partNumber: true,
            serialeRiscontrato: true,
            match: false,
            note: true,
            serSN: false
        });
        const [lastSelectedIndex, setLastSelectedIndex] = useState(null);
        const [displayCount, setDisplayCount] = useState(50);
        const [hasMore, setHasMore] = useState(true);

        useEffect(() => {
    async function loadData() {
        if (appCache.storico) {
            setStorico(appCache.storico);
            setFilteredData(appCache.storico);
            setLoading(false);
            return;
        }
        
        try {
            setLoadingProgress('Caricamento storico...');
            const res = await api('getStorico');
            
            setStorico(res.data);
            setFilteredData(res.data);
            appCache.storico = res.data;
        } catch (err) {
            console.error(err);
            alert('Errore caricamento: ' + err.message);
        } finally {
            setLoading(false);
            setLoadingProgress('');
        }
    }
    
    loadData();
}, []);

        useEffect(() => {
            const handleUpdate = async (event) => {
                if (event.detail && event.detail.storico) {
                    const updatedStorico = event.detail.storico;
                    setStorico(updatedStorico);
                    appCache.storico = updatedStorico;
                    
                    let filtered = [...updatedStorico];
                    if (filters.operatore) filtered = filtered.filter(i => (i.Operatore || '').toLowerCase().includes(filters.operatore.toLowerCase()));
                    if (filters.ubicazione) filtered = filtered.filter(i => (i.Ubicazioni || '').toUpperCase().includes(filters.ubicazione.toUpperCase()));
                    if (filters.cdc) filtered = filtered.filter(i => (i.Cdc || '').toUpperCase().includes(filters.cdc.toUpperCase()));
                    if (filters.stato) filtered = filtered.filter(i => (i.Stato || '').toUpperCase().includes(filters.stato.toUpperCase()));
                    if (filters.match) filtered = filtered.filter(i => i.Match === filters.match);
                    if (filters.codSap) filtered = filtered.filter(i => (i.CodSap || '').toUpperCase() === filters.codSap.toUpperCase());
                    if (filters.poNr) filtered = filtered.filter(i => (i.PoNr || '').toUpperCase() === filters.poNr.toUpperCase());
                    if (filters.dataOra) {
                        filtered = filtered.filter(i => {
                            const itemDate = new Date(i.Timestamp).toLocaleDateString('it-IT');
                            return itemDate.includes(filters.dataOra);
                        });
                    }
                    
                    setFilteredData(filtered);
                }
            };
            

            window.addEventListener('ats-data-updated', handleUpdate);
            return () => window.removeEventListener('ats-data-updated', handleUpdate);
        }, [filters]);

        const applyFilters = () => {
    // ✅ Usa UN SOLO ciclo invece di filter multipli
    const filtered = storico.reduce((acc, i) => {
        if (filters.operatore && !(i.Operatore || '').toLowerCase().includes(filters.operatore.toLowerCase())) return acc;
        if (filters.ubicazione && !(i.Ubicazioni || '').toUpperCase().includes(filters.ubicazione.toUpperCase())) return acc;
        if (filters.cdc && !(i.Cdc || '').toUpperCase().includes(filters.cdc.toUpperCase())) return acc;
        if (filters.stato && !(i.Stato || '').toUpperCase().includes(filters.stato.toUpperCase())) return acc;
        if (filters.match && i.Match !== filters.match) return acc;
        if (filters.codSap && (i.CodSap || '').toUpperCase() !== filters.codSap.toUpperCase()) return acc;
        if (filters.poNr && (i.PoNr || '').toUpperCase() !== filters.poNr.toUpperCase()) return acc;
        if (filters.dataOra) {
            const itemDate = new Date(i.Timestamp).toLocaleDateString('it-IT');
            if (!itemDate.includes(filters.dataOra)) return acc;
        }
        
        acc.push(i);
        return acc;
    }, []);
    
    setFilteredData(filtered);
    setDisplayCount(50); // ✅ Reset paginazione
    setHasMore(filtered.length > 50);
    setShowFilters(false);
};
        useEffect(() => {
    setHasMore(filteredData.length > displayCount);
}, [filteredData, displayCount]);

const displayedData = filteredData.slice(0, displayCount);

const loadMore = () => {
    const newCount = displayCount + 50;
    setDisplayCount(newCount);
    setHasMore(filteredData.length > newCount);
};

        const toggleColumn = (column) => {
            setVisibleColumns(prev => ({ ...prev, [column]: !prev[column] }));
        };
        const toggleSelectWithShift = (item, index, event) => {
    if (event.shiftKey && lastSelectedIndex !== null) {
        // Selezione range da lastSelectedIndex a index
        const start = Math.min(lastSelectedIndex, index);
        const end = Math.max(lastSelectedIndex, index);
        const rangeItems = filteredData.slice(start, end + 1);
        
        setSelected(prev => {
            // Rimuovi duplicati e aggiungi nuovi
            const existingIds = new Set(prev.map(i => i.id));
            const newItems = rangeItems.filter(i => !existingIds.has(i.id));
            return [...prev, ...newItems];
        });
    } else {

        const ripristinaSelezionati = async () => {

        for (const item of selected) {
            await supabaseClient
                .from('inventario')
                .delete()
                .eq('id', item.id);
            
            // 2. Aggiorna giacenza: rimuovi match, timestamp, operatore
            await supabaseClient
                .from('giacenza')
                .update({
                    match: null,
                    stato: 'DA INVENTARIARE',
                    timestamp: null,
                    operatore: null,
                    seriale_riscontrato: null
                })
                .eq('id_riga', item.id_riga_giacenza);
        }
        
        // 3. Aggiorna cache locale
        const updatedStorico = storico.filter(i => !selected.find(s => s.id === i.id));
        setStorico(updatedStorico);
        setFilteredData(updatedStorico);
        appCache.storico = updatedStorico;
        
        // 4. Aggiorna giacenza locale se caricata
        if (appCache.giacenza) {
            const updatedGiacenza = appCache.giacenza.map(g => {
                const matchedItem = selected.find(s => s.id_riga_giacenza === g.ID_Riga);
                if (matchedItem) {
                    return {
                        ...g,
                        Match: null,
                        Stato: 'DA INVENTARIARE',
                        inventariato: false,
                        timestamp: null,
                        operatore: null
                    };
                }
                return g;
            });
            appCache.giacenza = updatedGiacenza;
        }
        
        setSelected([]);

    } catch (err) {

    className="flex items-center gap-1 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
>
    ↩️ Ripristina in Giacenza
</button>
                            <button onClick={() => setSelected([])} className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Deseleziona</button>
                        </div>
                    </div>
                )}

                <div className="bg-white rounded-lg shadow overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-3 py-2">
                                        <input 
                                            type="checkbox" 
                                            onChange={(e) => setSelected(e.target.checked ? filteredData : [])} 
                                            checked={selected.length === filteredData.length && filteredData.length > 0} 
                                        />
                                    </th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.dataOra ? 'col-hidden' : ''}`}>Data/Ora</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.operatore ? 'col-hidden' : ''}`}>Operatore</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.poNr ? 'col-hidden' : ''}`}>Po Nr</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.codSap ? 'col-hidden' : ''}`}>Cod. SAP</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.descrizione ? 'col-hidden' : ''}`}>Descrizione</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.cdc ? 'col-hidden' : ''}`}>CDC</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.stato ? 'col-hidden' : ''}`}>Stato</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.ubicazione ? 'col-hidden' : ''}`}>Ubicazione</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.serialeAtteso ? 'col-hidden' : ''}`}>Seriale Atteso</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.partNumber ? 'col-hidden' : ''}`}>Part Number</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.serialeRiscontrato ? 'col-hidden' : ''}`}>Seriale Riscontrato</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.serSN ? 'col-hidden' : ''}`}>Serializzato</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.note ? 'col-hidden' : ''}`}>Note</th>
                                    <th className={`px-3 py-2 text-left font-semibold ${!visibleColumns.match ? 'col-hidden' : ''}`}>Match</th>
                                </tr>
                            </thead>
                            <tbody>
                                {displayedData.map((item, idx) => (
                                    <tr key={idx} className="border-t hover:bg-gray-50">
                                       <td className="px-3 py-2">
    <input 
        type="checkbox" 
        checked={selected.find(i => i.id === item.id) !== undefined} 
        onChange={(e) => {
            e.persist();
            toggleSelectWithShift(item, idx, e.nativeEvent);
        }} 
    />
</td>
                                        <td className={`px-3 py-2 whitespace-nowrap ${!visibleColumns.dataOra ? 'col-hidden' : ''}`}>
                                            {new Date(item.Timestamp).toLocaleString('it-IT', { 
                                                day: '2-digit', month: '2-digit', year: 'numeric', 
                                                hour: '2-digit', minute: '2-digit' 
                                            })}
                                        </td>
                                        <td className={`px-3 py-2 ${!visibleColumns.operatore ? 'col-hidden' : ''}`}>{item.Operatore}</td>
                                        <td className={`px-3 py-2 ${!visibleColumns.poNr ? 'col-hidden' : ''}`}>{item.PoNr || '-'}</td>
                                        <td className={`px-3 py-2 font-medium ${!visibleColumns.codSap ? 'col-hidden' : ''}`}>{item.CodSap}</td>
                                        <td className={`px-3 py-2 ${!visibleColumns.descrizione ? 'col-hidden' : ''}`}>
    <div 
        className="cursor-pointer"
        onDoubleClick={() => {
            alert(item.Descrizione || 'Nessuna descrizione');
        }}
        title={item.Descrizione || '-'}
    >
        <span className="text-xs">
            {item.Descrizione && item.Descrizione.length > 40 
                ? item.Descrizione.substring(0, 40) + '...' 
                : item.Descrizione || '-'}
        </span>
    </div>
</td>
                                        <td className={`px-3 py-2 ${!visibleColumns.cdc ? 'col-hidden' : ''}`}>{item.Cdc || '-'}</td>
                                        <td className={`px-3 py-2 ${!visibleColumns.stato ? 'col-hidden' : ''}`}>
                                            <span className={`px-2 py-1 rounded text-xs font-medium ${item.Stato === 'NUOVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                {item.Stato || '-'}
                                            </span>
                                        </td>
                                        <td className={`px-3 py-2 ${!visibleColumns.ubicazione ? 'col-hidden' : ''}`}>
                                            {editingItems[item.id] ? (
    <div className="flex gap-1">
        <input 
            type="text" 
            defaultValue={item.Ubicazioni} 
            onBlur={(e) => updateUbicazione(item, e.target.value)} 
            className="px-2 py-1 border rounded text-xs w-32" 
            autoFocus 
        />
    </div>
) : (
    <div className="flex gap-1 items-center">
        <span className="font-mono text-xs">{item.Ubicazioni}</span>
        <button 
            onClick={() => setEditingItems(prev => ({ ...prev, [item.id]: true }))} 
            className="text-blue-500 hover:text-blue-700"
        >
            <Icons.Edit />
        </button>
    </div>
)}
                                        </td>
                                        <td className={`px-3 py-2 font-mono text-xs ${!visibleColumns.serialeAtteso ? 'col-hidden' : ''}`}>{item.RISCONTROSERIALEF || '-'}</td>
                                        <td className={`px-3 py-2 ${!visibleColumns.partNumber ? 'col-hidden' : ''}`}>
                                            {editingPartNumber[item.id] ? (
    <div className="flex gap-1">
        <input 
            type="text" 
            defaultValue={item.PartNumber} 
            onBlur={(e) => updatePartNumberStorico(item, e.target.value)} 
            className="px-2 py-1 border rounded text-xs w-32" 
            autoFocus 
        />
    </div>
) : (
    <div className="flex gap-1 items-center">
        <span className="font-mono text-xs">{item.PartNumber || '-'}</span>
        <button 
            onClick={() => setEditingPartNumber(prev => ({ ...prev, [item.id]: true }))} 
            className="text-blue-500 hover:text-blue-700"
        >
            <Icons.Edit />
        </button>
    </div>
)}
                                        </td>
                                        <td className={`px-3 py-2 font-mono text-xs font-bold ${!visibleColumns.serialeRiscontrato ? 'col-hidden' : ''}`}>{item.Seriale_Riscontrato}</td>
                                        <td className={`px-3 py-2 text-center ${!visibleColumns.serSN ? 'col-hidden' : ''}`}>
    {item.SerSN === 'Sì' ? '✅' : '❌'}
</td>
                                        
                                        <td className={`px-3 py-2 ${!visibleColumns.note ? 'col-hidden' : ''}`}>
    {editingNote[item.id] ? (
    <div className="flex gap-1">
        <textarea 
            defaultValue={item.Note} 
            onBlur={(e) => updateNoteStorico(item, e.target.value)} 
            className="px-2 py-1 border rounded text-xs w-full" 
            rows="2"
            autoFocus 
        />
    </div>
) : (
    <div 
        className="flex gap-1 items-center cursor-pointer"
        onDoubleClick={() => {
            alert(item.Note || 'Nessuna nota');
        }}
    >
        <span 
            className="text-xs italic truncate block" 
            style={{ maxWidth: '60px' }}
            title={item.Note || '-'}
        >
            {item.Note && item.Note.length > 8 
                ? item.Note.substring(0, 8) + '...' 
                : item.Note || '-'}
        </span>
        <button 
            onClick={(e) => { 
                e.stopPropagation();
                setEditingNote(prev => ({ ...prev, [item.id]: true })); 
            }} 
            className="text-blue-500 hover:text-blue-700"
        >
            <Icons.Edit />
        </button>
    </div>
)}
</td>
                                        
<td className={`px-3 py-2 text-center ${!visibleColumns.match ? 'col-hidden' : ''}`}>
    {item.Match === 'OK' ? (
        <span className="text-green-600 font-bold">✓</span>
    ) : (
        <span className="text-red-600 font-bold">✗</span>
    )}
</td>
                                        
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
                <p className="text-gray-600">
                    Visualizzati: <strong>{filteredData.length}</strong> di <strong>{storico.length}</strong> riscontri
                </p>
                {hasMore && (
    <div className="text-center">
        <button 
            onClick={loadMore} 
            className="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 font-medium"
        >
            Carica altri 50 articoli
        </button>
    </div>
)}
            </div>
        );
    }

    // ============================================
    // RENDER FINALE
    // ============================================
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
    </body>
    </html>
